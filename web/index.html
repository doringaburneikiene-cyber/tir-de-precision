<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tir de précision">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tir de précision dienynas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E7EBEE; --surface:#FBFCFC; --surface-2:#F0F3F5; --ink:#13202C; --ink-2:#3B4753; --muted:#5C6874;
  --line:#D3D9DE; --line-2:#BFC7CE;
  --accent:#12B5B0; --accent-strong:#0A6E6B; --accent-soft:#D7F3F1;
  --btn:#13202C; --btn-ink:#FFFFFF;
  --o5:#104281; --o5-t:#FFFFFF; --o3:#2A78D6; --o3-t:#FFFFFF; --o1:#86B6EF; --o1-t:#0B2544; --o0:#C4CAD0; --o0-t:#13202C;
  --heat-0:#EEF4FC; --heat-1:#0D366B;
  --good:#006300; --bad:#B42F2F;
  --shadow:0 1px 2px rgba(19,32,44,.06),0 4px 14px rgba(19,32,44,.06);
  --r:14px;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1318; --surface:#172029; --surface-2:#1E2933; --ink:#EBF0F3; --ink-2:#CAD3DB; --muted:#A4AFBA;
    --line:#2B3642; --line-2:#3A4755;
    --accent:#3CCFC8; --accent-strong:#6FE0DA; --accent-soft:#12302F;
    --btn:#EBF0F3; --btn-ink:#0E1318;
    --o5:#B7D3F6; --o5-t:#0B2544; --o3:#3987E5; --o3-t:#FFFFFF; --o1:#1C5CAB; --o1-t:#FFFFFF; --o0:#3A444F; --o0-t:#EBF0F3;
    --heat-0:#1B2733; --heat-1:#9EC5F4;
    --good:#3CC23C; --bad:#F07A7A;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1318; --surface:#172029; --surface-2:#1E2933; --ink:#EBF0F3; --ink-2:#CAD3DB; --muted:#A4AFBA;
  --line:#2B3642; --line-2:#3A4755;
  --accent:#3CCFC8; --accent-strong:#6FE0DA; --accent-soft:#12302F;
  --btn:#EBF0F3; --btn-ink:#0E1318;
  --o5:#B7D3F6; --o5-t:#0B2544; --o3:#3987E5; --o3-t:#FFFFFF; --o1:#1C5CAB; --o1-t:#FFFFFF; --o0:#3A444F; --o0-t:#EBF0F3;
  --heat-0:#1B2733; --heat-1:#9EC5F4;
  --good:#3CC23C; --bad:#F07A7A;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{zoom:var(--fz,1);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:14px 156px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-cond);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:26px}
h2{font-size:21px}
h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.small{font-size:13.5px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--btn);color:var(--btn-ink);min-height:46px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.btn.warn{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;border-radius:999px;padding:8px 14px;min-height:40px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);box-shadow:none}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=date],textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:64px;resize:vertical}

/* top */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .label{color:var(--accent-strong)}
.top-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.lsw{display:flex;gap:2px;background:var(--surface-2);border-radius:999px;padding:2px;box-shadow:inset 0 0 0 1px var(--line)}
.lsw button{border:0;background:none;font-size:12px;font-weight:700;letter-spacing:.04em;padding:6px 10px;border-radius:999px;min-height:32px;color:var(--ink-2)}
.lsw button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.saving{background:var(--accent)} .dot.err{background:var(--bad)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-height:58px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--accent-strong)}

.edb{display:inline-flex;align-items:center;gap:2px;border:0;border-radius:999px;padding:4px 8px 4px 11px;font-size:12px;font-weight:700;letter-spacing:.04em;min-height:28px;background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.edb.pro{background:var(--accent);color:#0B2B2A;box-shadow:none}
.edb svg{width:16px;height:16px}
.ed-lead{margin:2px 0 0}
.edc{gap:10px}
.edc.pro{box-shadow:var(--shadow),inset 0 0 0 2px var(--accent)}
.edp{font-weight:700;font-size:14px;color:var(--ink-2);white-space:nowrap}
.edp s{color:var(--muted);font-weight:500;margin-right:4px}
.edl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.edl li{position:relative;padding-left:24px;font-size:14px;line-height:1.35}
.edl li::before{content:"";position:absolute;left:3px;top:4px;width:11px;height:6px;border-left:2.4px solid var(--accent-strong);border-bottom:2.4px solid var(--accent-strong);transform:rotate(-45deg)}
.edc.free .edl li:last-child::before{border:0;width:10px;height:2.4px;top:8px;transform:none;background:var(--muted)}
.edc.free .edl li:last-child{color:var(--muted)}
.kpis.in{margin:0}
.kpis.in .kpi{background:var(--surface-2);box-shadow:none}
body.no-nav .wrap{padding-block:14px 40px}
body.no-nav .nav{display:none}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner b{font-weight:700}
.banner.backup{flex-direction:column;gap:10px}

/* scoreboard */
.score-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.bigscore{font-family:var(--f-cond);font-weight:700;font-size:54px;line-height:.9;font-variant-numeric:tabular-nums}
.bigscore small{font-size:22px;color:var(--muted);font-weight:600}
.meta{display:flex;gap:14px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.meta b{font-family:var(--f-cond);font-size:19px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:minmax(76px,1.3fr) repeat(4,1fr) 44px;gap:4px;align-items:stretch}
.grid .h{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:2px}
.grid .h.l{text-align:left}
.grid .rl{display:flex;flex-direction:column;justify-content:center;font-size:12px;line-height:1.15;color:var(--ink-2)}
.grid .rl b{font-family:var(--f-cond);font-size:16px;color:var(--ink)}
.cell{border:0;border-radius:9px;min-height:42px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--f-cond);font-size:21px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;position:relative}
.cell.cur{box-shadow:inset 0 0 0 3px var(--accent)}
.cell.p5{background:var(--o5);color:var(--o5-t);box-shadow:none}
.cell.p3{background:var(--o3);color:var(--o3-t);box-shadow:none}
.cell.p1{background:var(--o1);color:var(--o1-t);box-shadow:none}
.cell.p0{background:var(--o0);color:var(--o0-t);box-shadow:none}
.cell.cur.p5,.cell.cur.p3,.cell.cur.p1,.cell.cur.p0{box-shadow:0 0 0 3px var(--accent)}
.cell .mk{position:absolute;right:4px;bottom:2px;font-family:var(--f-body);font-size:11px;font-weight:600;opacity:.85}
.rt{font-family:var(--f-cond);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}

.shot-title{display:flex;gap:14px;align-items:center}
.shot-title .diag{flex:0 0 76px}
.shot-title h2{font-size:24px}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{border:0;border-radius:12px;min-height:64px;padding:8px 12px;display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.out .pts{font-family:var(--f-cond);font-size:30px;font-weight:700;width:30px;text-align:center;flex:0 0 auto}
.out .t{display:flex;flex-direction:column;line-height:1.15}
.out .t b{font-size:16px}
.out .t span{font-size:12px;color:var(--ink-2)}
.out[aria-pressed="true"].o5{background:var(--o5);color:var(--o5-t);box-shadow:none}
.out[aria-pressed="true"].o3{background:var(--o3);color:var(--o3-t);box-shadow:none}
.out[aria-pressed="true"].o1{background:var(--o1);color:var(--o1-t);box-shadow:none}
.out[aria-pressed="true"].o0{background:var(--o0);color:var(--o0-t);box-shadow:none}
.out[aria-pressed="true"] .t span{color:inherit;opacity:.85}
.out.wide{grid-column:1/-1}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:360px;margin:0 auto;width:100%}
.pad button{border:0;border-radius:10px;min-height:58px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:600;line-height:1.15;padding:4px}
.pad button[aria-pressed="true"]{background:var(--ink);color:var(--surface);box-shadow:none}
.pad .ctr{padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:11px}
.pad .ctr svg{width:40px;height:40px}
.pad .ctr small{font-size:11px;font-weight:500;opacity:.75}
.pad .ar{display:block;font-size:17px;line-height:1;margin-bottom:2px}
.pad .pc{display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--accent-soft)}
.pad .pc svg{width:48px;height:48px}
.pop{position:fixed;inset:0;z-index:55;display:flex;align-items:flex-end;justify-content:center;padding:12px 10px calc(12px + env(safe-area-inset-bottom,0px))}
.pop-back{position:absolute;inset:0;background:rgba(10,16,22,.5)}
.pop-card{position:relative;background:var(--surface);border-radius:18px;padding:16px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.cd{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 1px var(--line)}
.cd-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cd-t{font-family:var(--f-cond);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.cd-pace{font-size:13px;color:var(--ink-2);text-align:right}
.cd-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.cd-bar i{display:block;height:100%;width:100%;background:var(--accent);border-radius:99px;transition:width 1s linear}
.cd.warn{background:#FFF4D6;box-shadow:inset 0 0 0 1px #E8B93A}.cd.warn .cd-bar i{background:#E0A11B}
.cd.over{background:#FDE3E1;box-shadow:inset 0 0 0 1px var(--bad)}.cd.over .cd-t,.cd.over .cd-pace{color:var(--bad)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cd.warn{background:#3A2F12}:root:not([data-theme="light"]) .cd.over{background:#3A1C1A}}
:root[data-theme="dark"] .cd.warn{background:#3A2F12}:root[data-theme="dark"] .cd.over{background:#3A1C1A}
.bdg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.bdg{background:var(--surface-2);border-radius:12px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;font-size:12px;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.bdg b{color:var(--ink-2);font-size:12.5px;line-height:1.2}
.bdg>span:last-child{font-size:11px;line-height:1.25}
.bdg-ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--muted)}
.bdg-ic svg{width:22px;height:22px}
.bdg.ok{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--accent)}
.bdg.ok b{color:var(--ink)}
.bdg.ok .bdg-ic{background:var(--accent-soft);color:var(--accent-strong)}
.bdg-pr{display:block;width:70px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 3px;overflow:hidden}
.bdg-pr i{display:block;height:100%;background:var(--accent)}
.wr h3{margin-top:2px}
.tbl.ct td:nth-child(n+2),.tbl.ct th:nth-child(n+2){text-align:right}
.tbl.ct tr.hl td{background:var(--accent-soft)}
.tipbox{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.tipbox p{margin:0;line-height:1.45}
.gchart{width:100%;height:auto;display:block}
.goal h3{margin-top:4px}
.gl{font-size:14px}
.blk{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:14px}
.erows{display:flex;flex-direction:column}
.erow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.close-box{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.close-box p{margin:0}
.dir-note{text-align:center;font-size:12px;color:var(--muted)}

.sw{padding:10px;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.sw-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.pl-chip{flex:1 0 auto;min-width:96px;border:0;border-radius:12px;padding:8px 12px;min-height:54px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);text-align:left}
.pl-chip b{font-size:16px;line-height:1.1;white-space:nowrap}
.pl-chip span{font-size:12px;color:var(--ink-2);white-space:nowrap}
.pl-chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);box-shadow:inset 0 -4px 0 var(--accent)}
.pl-chip[aria-pressed="true"] span{color:inherit;opacity:.8}
.pl-chip.add{flex:0 0 auto;min-width:64px;align-items:center}
.pl-chip.add b{font-size:20px}
.rotrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:-4px}
.rotrow .chip{min-height:32px;padding:5px 11px;font-size:13px}
.thrower{font-size:14px;color:var(--accent-strong)}
.thrower b{font-size:17px;color:var(--ink)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-20px);background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:12px;font-weight:700;font-size:17px;opacity:0;pointer-events:none;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25);transition:opacity .2s,transform .2s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cel{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:rgba(10,16,22,.55)}
.cel-cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cel-card{position:relative;background:var(--surface);color:var(--ink);border-radius:20px;padding:24px 20px 18px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.cel-card h2{font-size:30px}
.cel-card p{color:var(--ink-2);font-size:15px}
.cel-badge{width:76px;height:76px;margin:0 auto 4px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center}
.cel-badge svg{width:42px;height:42px}
@media (prefers-reduced-motion:no-preference){.cel-card{animation:celpop .4s cubic-bezier(.2,1.4,.4,1)}}
@keyframes celpop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.week{display:flex;flex-direction:column;gap:10px}
.week-row{display:grid;grid-template-columns:minmax(70px,1fr) auto auto;gap:10px;align-items:center}
.week-row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wdots{display:flex;gap:4px}
.wdot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.wdot.on{background:var(--o3);color:var(--o3-t);box-shadow:none}
.wdot.today{box-shadow:inset 0 0 0 2px var(--accent)}
.wdot.on.today{box-shadow:0 0 0 2px var(--accent)}
.wcount{font-family:var(--f-cond);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.wcount.goal{color:var(--good)}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.sdot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-cond);font-weight:700;font-size:14px}

function persistSession(sess){
  sess.updatedAt=Date.now();
  if(isFree()){lsSet("tdp-free-cur",S.fs);return;}
  if(S.store!=="db"){saveLocalAll();setStatus("ok");return;}
  let q=saveQ.get(sess.id);if(!q){q={};saveQ.set(sess.id,q);}
  clearTimeout(q.timer);setStatus("saving");
  q.timer=setTimeout(()=>{q.timer=null;flush(sess.id);},350);
}
async function flush(id){
  const q=saveQ.get(id);if(!q)return;
  if(q.inflight){q.dirty=true;return;}
  const sess=S.sessions.find(x=>x.id===id);
  if(!sess){saveQ.delete(id);return;}
  q.inflight=true;q.dirty=false;
  const body=clone(sess);delete body.id;
  try{await DB.collection("sessions").doc(id).set(body);setStatus("ok");}
  catch(e){
    if(e&&e.code==="invalid_argument"){S.ro=true;setStatus("err");q.inflight=false;saveQ.delete(id);render();return;}
    setStatus("err");q.dirty=true;await sleep(2500+Math.random()*1000);
  }
  q.inflight=false;
  if(q.dirty)flush(id);else if(!q.timer)saveQ.delete(id);
}

function mergeSnap(list,snap){
  const map=new Map(list.map(s=>[s.id,s]));const seen=new Set();const next=[];
  for(const d of snap.docs){
    seen.add(d.id);const data=d.data();const local=map.get(d.id);
    if(local&&(saveQ.has(d.id)||(local.updatedAt||0)>(data.updatedAt||0)))next.push(local);
    else next.push(Object.assign(clone(data),{id:d.id}));
  }
  for(const [id,s] of map)if(!seen.has(id)&&saveQ.has(id))next.push(s);
  return next;
}

/* ---------- Demo data (never written) ---------- */
const DEMO=(function(){
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646;};
  const players=[{id:"demo1",name:t("Jonas (pavyzdys)")},{id:"demo2",name:t("Rūta (pavyzdys)")}];
  const sessions=[];const now=new Date();
  players.forEach((pl,pi)=>{
    for(let i=0;i<24;i++){
      const dt=new Date(now);dt.setDate(dt.getDate()-(118-i*5)-pi);
      const prog=i/23, skill=(pi?0.52:0.47)+prog*0.16;
      const shots=[];
      ORDER.forEach(([a,d])=>{
        const diff=[0,0.05,0.1,0.14,0.08][a-1]+(d-6)*0.07;
        const pHit=Math.max(0.1,Math.min(0.95,skill+0.2-diff));
        let o,p,sh={a,d,s:0,t:dt.getTime()};
        if(rnd()<pHit){
          sh.c=rnd()<0.75?"F":"B";sh.h=rnd()<0.6?"C":(rnd()<0.5?"L":"R");
          if(a===5){o=rnd()<0.6?"out":"moved";p=o==="out"?5:3;}
          else{const r=rnd();const pc=0.28+prog*0.14+(sh.h==="C"?0.1:-0.1);
            if(r<pc){o="carreau";p=5}else if(r<pc+0.4){o="reussi";p=3}else if(a>1&&r<pc+0.5){o="obst";p=1}else{o="touche";p=1}}
        }else{
          o="miss";p=0;const r=rnd();
          if(a>1&&a<5&&r<0.18)sh.m="OB";else{
            const shortB=d>=8?0.5:0.35;const lng=rnd()<shortB?"S":(rnd()<0.45?"N":"");
            const lat=rnd()<0.55?(rnd()<(pi?0.4:0.62)?"W":"E"):"";
            sh.m=(lng+lat)||"C";
            if(sh.m==="SW"||sh.m==="SE"||sh.m==="NW"||sh.m==="NE"||["N","S","W","E","C"].includes(sh.m));else sh.m="C";
          }
        }
        sh.o=o;sh.p=p;shots.push(sh);
      });
      sessions.push({id:"d"+pi+"_"+i,playerId:pl.id,date:ymd(dt),kind:i%6===5?"comp":"train",mode:"full",series:1,shots,createdAt:dt.getTime()});
    }
  });
  return{players,sessions};
})();

  const obs=(x,y)=>`<circle cx="${x}" cy="${y}" r="9" fill="var(--ink-2)"/>`;
  const jack=(x,y,t)=>`<circle cx="${x}" cy="${y}" r="4.5" fill="${t?"var(--accent)":"var(--ink-2)"}" stroke="${t?"var(--ink)":"none"}" stroke-width="1.5"/>`;
  let body="";
  if(a===1)body=tgt(50,50);
  if(a===2)body=tgt(50,50)+jack(50,69);

  if(a===4)body=tgt(50,48)+obs(50,72);
  if(a===5)body=jack(50,76,true);
  return `<svg viewBox="0 0 100 100" width="${W}" height="${W}" aria-hidden="true">${c}${body}</svg>`;
}

function confetti(cv){
  const ctx=cv.getContext("2d");if(!ctx)return()=>{};
  const dpr=Math.min(2,window.devicePixelRatio||1);const W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);

function celDone(key){const l=lsGet("tdp-cel",[]);if(l.includes(key))return true;l.push(key);lsSet("tdp-cel",l.slice(-300));return false;}
function checkSeriesRecord(s,k){
  const sh=seriesShots(s,k);if(sh.length<20)return;
  const sum=sh.reduce((x,y)=>x+y.p,0);
  const prev=S.sessions.filter(x=>x.playerId===s.playerId&&x.mode==="full").flatMap(x=>seriesTotals(x).filter(tt=>tt.n===20&&!(x.id===s.id&&tt.k===k)).map(tt=>tt.sum));
  const name=esc(playerName(s.playerId));
  if(sum===100){if(!celDone("pb:"+s.id+":"+k))celebrate("trophy",t("Tobula serija!"),t("{name}, 100 taškų iš 100. Tai maksimalus įmanomas rezultatas!",{name}));return;}
  if(!prev.length)return;
  const best=Math.max(...prev);
  if(sum>best&&!celDone("pb:"+s.id+":"+k))celebrate("trophy",t("Naujas rekordas!"),t("{name}, <b>{sum}</b> taškų – geriau nei ankstesnis geriausias rezultatas ({best}). Puikiai!",{name,sum,best}));
}
function weekStart(){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d;}
function weekDays(pid){
  const mon=weekStart();const days=[];for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);days.push(ymd(d));}
  const set=new Set(S.sessions.filter(x=>x.playerId===pid&&x.shots&&x.shots.length&&days.includes(x.date)).map(x=>x.date));
  return{days,set,n:set.size,key:days[0]};
}
const WEEK_GOAL=4;
function checkWeek(pid){
  const w=weekDays(pid);if(w.n<WEEK_GOAL)return;
  if(celDone("wk:"+pid+":"+w.key+":"+w.n))return;
  if(w.n>WEEK_GOAL&&w.n<7)return;
  const name=esc(playerName(pid));
  celebrate("star",w.n>=7?t("Visa savaitė!"):t("Šaunuolis, {name}!",{name}),w.n>=7?t("{name}, treniravaisi kiekvieną šios savaitės dieną. Įspūdingas atsidavimas!",{name}):t("Šią savaitę treniravaisi jau <b>{n}</b> dienas. Toks reguliarumas ir atneša rezultatus – taip ir toliau!",{n:w.n}));
}

function backupDue(){

function seriesSummary(s,k){

const CD_LEN=15*60;

function cdHtml(s,k,n){const st=cdStart(s,k);

let timerInt=null;
function tickTimer(){
  clearInterval(timerInt);
  const cd=$("#cd");
  if(cd){const st=+cd.dataset.start,n=+cd.dataset.n,key=cd.dataset.key;
    const tEl=$("#cd-t"),bar=$("#cd-bar"),pace=$("#cd-pace");
    const f=()=>{if(!document.body.contains(cd)){clearInterval(timerInt);return;}
      if(!st){tEl.textContent="15:00";bar.style.width="100%";return;}
      const el=Math.floor((Date.now()-st)/1000),rem=CD_LEN-el,left=20-n;
      const a=Math.abs(rem);tEl.textContent=(rem<0?"−":"")+Math.floor(a/60)+":"+pad2(a%60);
      bar.style.width=Math.max(0,Math.min(100,rem/CD_LEN*100))+"%";
      const per=left?rem/left:rem;let cls="ok";
      if(rem<=0)cls="over";else if(per<35||rem<=60)cls="warn";
      cd.className="cd "+cls;
      if(pace)pace.innerHTML=rem<=0?`<b>${t("Laikas baigėsi")}</b>`:t("Liko {n} met. · ~{s} s metimui",{n:left,s:Math.max(0,Math.floor(per))});
      if(rem<=300&&rem>290)cdAlert(key,300,t("Liko 5 minutės"));
      if(rem<=60&&rem>50)cdAlert(key,60,t("Liko 1 minutė"));
      if(rem<=0&&rem>-10)cdAlert(key,0,t("15 minučių laikas baigėsi"));};
    f();timerInt=setInterval(f,1000);return;}
  const el=$("#timer");if(!el)return;
  const f=()=>{const t0=+el.dataset.t0;if(!t0){el.textContent="0:00";return;}const s=Math.max(0,Math.floor((Date.now()-t0)/1000));el.textContent=Math.floor(s/60)+":"+pad2(s%60);};
  f();timerInt=setInterval(()=>{if(!document.body.contains(el)){clearInterval(timerInt);return;}f();},1000);
}

/* ----- Recording actions ----- */
function saveGroup(){lsSet("tdp-group",S.group);}
function groupSessions(){if(isFree())return S.fs&&!S.fs.done?[S.fs]:[];return S.group.ids.map(id=>S.sessions.find(x=>x.id===id)).filter(x=>x&&!x.done);}
function switchTo(id,announce){
  if(id===S.activeId)return;const s=S.sessions.find(x=>x.id===id);if(!s)return;
  if(S.activeId)S.curs[S.activeId]=Object.assign({},S.cur);
  setActive(id);S.editing=false;S.adding=false;
  if(s.mode==="full"){const c=S.curs[id];const k=curSeries(s);S.cur=c&&findShot(s,k,c.a,c.d)<0?c:(nextEmpty(s,k,null)||{a:1,d:6});}
  if(announce)toast(t("Dabar meta: {name}",{name:playerName(s.playerId)}));
}
function rotate(){
  const g=groupSessions();if(g.length<2)return;const i=g.findIndex(x=>x.id===S.activeId);
  for(let j=1;j<g.length;j++){const s=g[(i+j)%g.length];if(s.mode!=="full"||seriesShots(s,curSeries(s)).length<20){switchTo(s.id,true);return;}}
}
let toastT;
function toast(t){let el=$("#toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}
  el.textContent=t;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),1600);}
function newSessionFor(pid,base){
  return {id:uid("s"),playerId:pid,date:base.date,kind:base.kind,mode:base.mode,series:1,note:base.note||"",shots:[],createdAt:Date.now(),updatedAt:Date.now(),done:false,timed:!!base.timed&&base.mode==="full"};
}
function startSession(){
  const nf=S.nf;const note=$("#nf-note");const dt=$("#nf-date");
  if(note)nf.note=note.value;if(dt&&dt.value)nf.date=dt.value;
  if(!nf.pids||!nf.pids.length)return;
  lsSet("tdp-lastps",nf.pids);
  const base={date:nf.date||today(),kind:nf.kind,mode:nf.mode,note:nf.note.trim(),timed:nfTimed()};
  const made=nf.pids.map(pid=>newSessionFor(pid,base));
  made.forEach(x=>{S.sessions.push(x);persistSession(x);});
  S.group.ids=made.map(x=>x.id);S.group.blk=nf.mode==="drill"?(nf.blk||0):0;S.group.blkStart=Date.now();saveGroup();S.curs={};
  setActive(made[0].id);S.cur=nf.preCur||{a:1,d:6};nf.preCur=null;S.editing=false;nf.note="";
  if(nf.kind==="comp"){const pp=S.players.find(x=>x.id===nf.pids[0]);if(pp&&planHas(pp)){S.view="note";S.noteTab="pre";S.noteP=pp.id;S.preFromStart=true;S.planEdit=null;}}
  render();window.scrollTo(0,0);
}
function addToGroup(pid){
  const cur=active();if(!cur)return;
  const ex=groupSessions().find(x=>x.playerId===pid);if(ex){switchTo(ex.id,true);render();return;}
  const x=newSessionFor(pid,cur);S.sessions.push(x);persistSession(x);
  S.group.ids.push(x.id);saveGroup();S.adding=false;
  if(cur.mode==="full")S.curs[x.id]={a:1,d:6};
  switchTo(x.id,true);render();
}
function recordOutcome(key){
  const s=active();if(!s)return;const a=AT[S.cur.a-1];const o=a.outs.find(x=>x.k===key);if(!o)return;
  const k=curSeries(s);let idx=S.pending;
  if(idx==null&&s.mode==="full"){const i=findShot(s,k,a.n,S.cur.d);if(i>=0){idx=i;S.fix=true;}}
  if(idx!=null&&s.shots[idx]){
    const sh=s.shots[idx];const changedKind=(sh.o==="miss")!==(o.k==="miss");
    sh.o=o.k;sh.p=o.p;if(changedKind){delete sh.m;delete sh.cd;delete sh.c;delete sh.h;}
    S.pending=idx;
  }else{
    if(s.timed&&s.mode==="full")setCdStart(s,k);
    s.shots.push({a:a.n,d:S.cur.d,s:s.mode==="full"?k:0,o:o.k,p:o.p,t:Date.now()});
    S.pending=s.shots.length-1;S.fix=false;
    let run=0;for(let i=s.shots.length-1;i>=0&&s.shots[i].p===5;i--)run++;
    if(run===3||run===5||run===10)setTimeout(()=>toast(t("{n} kartus iš eilės po 5 taškus!",{n:run})),0);
  }
  S.editing=false;S.adding=false;persistSession(s);render();
}
function setDetail(f,v){
  const s=active();if(!s||S.pending==null)return;const sh=s.shots[S.pending];if(!sh)return;
  if(sh[f]===v)delete sh[f];else sh[f]=v;
  if(f==="m")delete sh.cd;
  persistSession(s);
  if(f==="m"&&sh.m){advance();return;}
  if(sh.o!=="miss"&&sh.c&&(sh.h||sh.a===5)){advance();return;}
  render();
}
function advance(){
  const s=active();S.pending=null;S.closePop=false;S.editing=false;
  const prevA=S.cur.a;const fix=S.fix;S.fix=false;
  if(s&&s.mode==="full"){const n=nextEmpty(s,curSeries(s),S.cur);if(n)S.cur=n;}
  if(s&&!fix&&s.mode==="full"&&!isFree()){checkSeriesRecord(s,curSeries(s));if(seriesShots(s,curSeries(s)).length===20)checkBadges(s.playerId);}
  if(s&&!fix&&s.mode==="drill"&&S.group.blk){blockStep(s);render();return;}
  if(s&&!fix){
    const r=S.group.rot;const done=s.mode==="full"&&seriesShots(s,curSeries(s)).length>=20;
    if(r==="shot"||(r==="task"&&s.mode==="full"&&(S.cur.a!==prevA||done))||(r==="manual"&&done))rotate();
  }
  render();
}
function blkCount(x){const t0=S.group.blkStart||0;return x.shots.filter(y=>y.a===S.cur.a&&y.d===S.cur.d&&(y.t||0)>=t0).length;}
function blockStep(s){
  const N=S.group.blk;const g=groupSessions();if(!g.length)return;
  if(g.every(x=>blkCount(x)>=N)){
    const i=DIST.indexOf(S.cur.d);const nd=DIST[(i+1)%DIST.length];
    S.cur.d=nd;S.group.blkStart=Date.now();saveGroup();
    let msg=i===DIST.length-1?t("Visi atstumai baigti – vėl nuo {d} m",{d:nd}):t("Dabar {d} m",{d:nd});
    if(g.length>1&&S.group.rot!=="manual"){switchTo(g[0].id,false);msg+=" · "+t("Dabar meta: {name}",{name:playerName(g[0].playerId)});}
    setTimeout(()=>toast(msg),0);return;
  }
  if(g.length<2)return;
  const r=S.group.rot;const i=g.findIndex(x=>x.id===S.activeId);
  const nextOpen=()=>{for(let j=1;j<=g.length;j++){const x=g[(i+j)%g.length];if(blkCount(x)<N)return x;}return null;};
  if(r==="block"&&blkCount(s)>=N){const x=nextOpen();if(x)switchTo(x.id,true);}
  else if(r==="shot"){const x=nextOpen();if(x)switchTo(x.id,true);}
}
function undo(){
  const g=groupSessions();let best=null;
  g.forEach(x=>x.shots.forEach((sh,i)=>{if(!best||(sh.t||0)>=(best.sh.t||0))best={x,i,sh};}));
  if(!best)return;
  best.x.shots.splice(best.i,1);S.pending=null;S.editing=false;S.fix=false;
  if(best.x.id!==S.activeId)switchTo(best.x.id,true);
  if(best.x.mode==="full")S.cur={a:best.sh.a,d:best.sh.d};
  persistSession(best.x);render();
}
function endSession(){
  if(isFree()){const s=S.fs;if(!s)return;if(!s.shots.length){freeReset();return;}s.done=true;S.pending=null;S.editing=false;S.ff={a:0,d:0};lsSet("tdp-free-cur",s);render();window.scrollTo(0,0);return;}
  const g=groupSessions();const cur=active();if(cur&&!g.includes(cur))g.push(cur);
  let focus=null;
  g.forEach(s=>{if(!s.shots.length){deleteSession(s.id);}else{s.done=true;persistSession(s);if(!focus||s.id===S.activeId)focus=s;}});
  S.group.ids=[];saveGroup();S.curs={};S.adding=false;
  [...new Set(g.filter(x=>x.shots.length).map(x=>x.playerId))].forEach(pid=>{checkWeek(pid);checkBadges(pid);});
  setActive(null);S.view=focus?"stats":"rec";lsSet("tdp-view",S.view);
  if(focus){S.f.player=g.filter(s=>s.shots.length).length>1?"":focus.playerId;lsSet("tdp-f",S.f);}
  const doneIds=g.filter(x=>x.shots.length).map(x=>x.id);
  if(doneIds.length&&!lsGet("tdp-reflect-off",false)){S.reflectBack="stats";openReflect(doneIds);}
  render();window.scrollTo(0,0);
}

function dayNum(d){return Math.round(Date.parse(d+"T12:00:00")/864e5);}
function badgeStats(pid){
  const ss=S.sessions.filter(s=>s.playerId===pid&&s.shots.length);
  const days=[...new Set(ss.map(s=>s.date))].map(dayNum).sort((a,b)=>a-b);
  let streak=0,run=0,prev=null;days.forEach(d=>{run=prev!=null&&d===prev+1?run+1:1;streak=Math.max(streak,run);prev=d;});
  const tn=dayNum(today());let cur=0;if(days.length){const last=days[days.length-1];if(last>=tn-1){cur=1;for(let i=days.length-2;i>=0&&days[i]===days[i+1]-1;i--)cur++;}}
  const wk={};ss.forEach(s=>{const d=new Date(s.date+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));const k=dayNum(ymd(d));(wk[k]=wk[k]||new Set()).add(s.date);});
  const goodW=Object.keys(wk).filter(k=>wk[k].size>=WEEK_GOAL).map(Number).sort((a,b)=>a-b);
  let wks=0,wr=0,pw=null;goodW.forEach(w=>{wr=pw!=null&&w===pw+7?wr+1:1;wks=Math.max(wks,wr);pw=w;});
  let best=0,perf=0,timed=0;ss.filter(s=>s.mode==="full").forEach(s=>seriesTotals(s).forEach(tt=>{if(tt.n!==20)return;best=Math.max(best,tt.sum);
    const sh=seriesShots(s,tt.k);if(AT.some(a=>sh.filter(x=>x.a===a.n).reduce((q,y)=>q+y.p,0)===20))perf=1;

  let rmax=0;ss.forEach(s=>{let r=0;s.shots.slice().sort((a,b)=>(a.t||0)-(b.t||0)).forEach(x=>{r=x.p===5?r+1:0;rmax=Math.max(rmax,r);});});

/* ----- Goal (Tikslas) ----- */
const WK=6048e5;
function levelNow(pid,since){
  const from=since||ymd(new Date(Date.now()-60*864e5));
  let ss=S.sessions.filter(s=>s.playerId===pid&&s.date>=from&&s.mode==="full"&&s.shots.length);
  let pts=dayPts(ss,()=>true);
  if(!pts.length)return null;
  const fit=trendFit(pts);const W=pts.reduce((a,p)=>a+p.n,0);const mean=pts.reduce((a,p)=>a+p.v*p.n,0)/W;
  const span=fit?(fit.t1-fit.t0):0;
  return{now:fit?fit.end:mean,slope:fit&&span>=14*864e5?(fit.end-fit.start)/(span/WK):null,pts,days:pts.length,fit};
}
function goalCalc(p){
  const g=p.goal;if(!g||!g.date)return null;
  const today0=Date.parse(today()+"T12:00:00"),gd=Date.parse(g.date+"T12:00:00");
  const weeks=(gd-today0)/WK;const lv=levelNow(p.id);
  const now=lv?lv.now:null;const need=now!=null&&weeks>0?(g.target-now)/weeks:null;
  const spanW=lv&&lv.fit?(lv.fit.t1-lv.fit.t0)/WK:0;
  const proj=lv&&lv.slope!=null&&weeks>0&&weeks<=Math.max(4,spanW*1.5)?Math.max(0,Math.min(100,now+lv.slope*weeks)):null;
  let st="nodata";
  if(weeks<=0)st="past";else if(now==null)st="nodata";else if(now>=g.target)st="reached";else if(lv.slope==null)st="early";
  else if(lv.slope>=need)st="ok";else if(lv.slope>=need*0.5&&lv.slope>0)st="close";else st="behind";
  return{g,weeks,lv,now,need,proj,st};
}
function weekFocus(pid){
  const since=ymd(new Date(Date.now()-30*864e5));
  const sh=flatShots(S.sessions.filter(s=>s.playerId===pid&&s.date>=since),{a:0,d:0});
  const cells=[];AT.forEach(a=>DIST.forEach(d=>{const x=sh.filter(y=>y.a===a.n&&y.d===d);if(x.length>=3)cells.push({a:a.n,d,v:avg(x.map(y=>y.p)),n:x.length});}));
  cells.sort((x,y)=>x.v-y.v);return{cells:cells.slice(0,2),n:sh.length};
}
function goalChart(p,c){
  const g=c.g;const t0=Date.parse((g.set||today())+"T12:00:00"),t1=Date.parse(g.date+"T12:00:00");
  const s60=ymd(new Date(Date.now()-60*864e5));const pts=(levelNow(p.id,g.set&&g.set<s60?g.set:s60)||{pts:[]}).pts;
  const a0=Math.min(t0,pts.length?pts[0].t:t0);const dom=[a0,Math.max(t1,a0+864e5)];
  const W=320,H=150,ml=26,mr=10,mt=10,mb=20,iw=W-ml-mr,ih=H-mt-mb;
  const X=tt=>ml+(tt-dom[0])/(dom[1]-dom[0])*iw,Y=v=>mt+ih-(Math.max(0,Math.min(100,v))/100)*ih;
  let s2="";[0,25,50,75,100].forEach(v=>{s2+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="0.7"/><text x="${ml-4}" y="${Y(v)+3}" text-anchor="end" font-size="8" fill="var(--muted)">${v}</text>`;});
  const lab=tt=>{const d=new Date(tt);return pad2(d.getDate())+"."+pad2(d.getMonth()+1);};
  const tn=Date.parse(today()+"T12:00:00");

function dominantIssue(shots){
  const M=missAgg(shots);if(M.miss.length<4)return null;
  const out=[];const dm=M.short+M.long,lr=M.left+M.right;
  if(dm>=3)out.push({k:M.short>=M.long?"short":"long",w:Math.max(M.short,M.long)});
  if(lr>=3&&Math.abs(M.left-M.right)/lr>=0.2)out.push({k:M.left>M.right?"left":"right",w:Math.max(M.left,M.right)});
  if((M.c.OB||0)>=2)out.push({k:"ob",w:M.c.OB});
  const hits=shots.filter(x=>x.p>0&&x.h);if(hits.length>=6&&hits.filter(x=>x.h!=="C").length/hits.length>=0.4)out.push({k:"side",w:hits.filter(x=>x.h!=="C").length});
  return out.sort((a,b)=>b.w-a.w);
}
function planSuggestions(p){
  const iss=dominantIssue(playerShots(p.id,90))||[];const have=planOf(p).ifs.map(x=>x.w);
  return iss.map(i=>({w:t(TIP[i.k][0]),t:t(TIP[i.k][1])})).filter(s=>!have.includes(s.w));
}
function weakSpot(pid){
  const all=playerShots(pid,90);const cells=[];
  AT.forEach(a=>DIST.forEach(d=>{const sh=all.filter(x=>x.a===a.n&&x.d===d);if(sh.length>=3)cells.push({a:a.n,d,v:avg(sh.map(x=>x.p)),sh});}));
  if(cells.length<3)return null;cells.sort((x,y)=>x.v-y.v);const c=cells[0];
  const iss=dominantIssue(c.sh);return{a:c.a,d:c.d,tip:iss&&iss.length?t(TIP[iss[0].k][1]):""};
}

  else{const c=periodCut(f.period);if(c)ss=ss.filter(s=>s.date>=c);}

function trendFit(pts,dom){
  if(pts.length<3)return null;const W=pts.reduce((a,p)=>a+p.n,0);
  const mt=pts.reduce((a,p)=>a+p.n*p.t,0)/W,mv=pts.reduce((a,p)=>a+p.n*p.v,0)/W;
  let c=0,v=0;pts.forEach(p=>{c+=p.n*(p.t-mt)*(p.v-mv);v+=p.n*(p.t-mt)*(p.t-mt);});
  const sl=v?c/v:0;const at=t=>Math.max(0,Math.min(100,mv+sl*(t-mt)));
  const t0=pts[0].t,t1=pts[pts.length-1].t;return{at,start:at(t0),end:at(t1),d:at(t1)-at(t0),t0,t1};
}

    h+=`<div class="scroll-x"><table class="tbl ct"><thead><tr><th></th><th>${t("Trenir.")}</th><th>${t("Varžyb.")}</th><th>${t("Skirtumas")}</th></tr></thead><tbody>${rows.map(r=>`<tr${r===worst&&r.d<=-3?' class="hl"':""}><td>${r.lab}</td><td>${fmt0(r.va)}</td><td>${fmt0(r.vb)}</td><td><span class="delta ${r.d>=2?"up":r.d<=-2?"down":"flat"}">${r.d>0?"+":""}${fmt0(r.d)}</span></td></tr>`).join("")}</tbody></table></div>
     <p class="small muted">${t("Rezultatas 100 balų skalėje (vid. taškai × 20), skaičiuojama tik iš pilnų serijų.")}${worst.d<=-3?" "+t("Labiausiai varžybose krenta: {x}.",{x:worst.lab.replace(/<[^>]+>/g,"")}):""}</p>`;}
  return h+`</div>`;
}
function consistencyHtml(f){
  const ss=filteredSessions(f).filter(s=>s.mode==="full");
  const list=[];ss.forEach(s=>seriesTotals(s).forEach(x=>{if(x.n===20)list.push({v:x.sum,c:s.kind==="comp",d:s.date});}));

  const v=list.map(x=>x.v);const q1=quant(v,.25),q3=quant(v,.75),med=quant(v,.5),sd=sdev(v);
  const W=320,H=64,ml=10,mr=10,X=x=>ml+x/100*(W-ml-mr);
  let g=`<rect x="${X(q1)}" y="14" width="${Math.max(2,X(q3)-X(q1))}" height="24" rx="6" fill="var(--accent-soft)"/><line x1="${X(med)}" x2="${X(med)}" y1="10" y2="42" stroke="var(--accent-strong)" stroke-width="2.5"/>`;
  [0,25,50,75,100].forEach(x=>{g+=`<line x1="${X(x)}" x2="${X(x)}" y1="46" y2="50" stroke="var(--line)"/><text x="${X(x)}" y="61" text-anchor="middle" font-size="9" fill="var(--muted)">${x}</text>`;});
  list.forEach((x,i)=>{g+=`<circle cx="${X(x.v).toFixed(1)}" cy="${26+((i%3)-1)*6}" r="3.6" fill="${x.c?"var(--o5)":"var(--o1)"}" stroke="var(--surface)" stroke-width="1"/>`;});
  h+=`<p class="small ink2">${t("Kiekvienas taškas – viena pilna serija. Spalvota juosta – kur patenka pusė jūsų serijų, linija – mediana.")}</p>
   <svg viewBox="0 0 ${W} ${H}" class="gchart" role="img" aria-label="${t("Serijų pasiskirstymas")}">${g}</svg>
   <div class="legend"><span><i class="cr" style="background:var(--o1)"></i>${t("Treniruotė")}</span><span><i class="cr" style="background:var(--o5)"></i>${t("Varžybos")}</span></div>
   <div class="kpis in"><div class="kpi"><span class="label">${t("Blogiausia / geriausia")}</span><span class="v num">${Math.min(...v)}<small> / ${Math.max(...v)}</small></span><span class="delta flat">${t("{n} serijos",{n:v.length})}</span></div>
   <div class="kpi"><span class="label">${t("Dažniausiai")}</span><span class="v num">${fmt0(q1)}<small>–${fmt0(q3)}</small></span><span class="delta flat">${t("svyravimas ±{v}",{v:fmt1(sd)})}</span></div></div>`;
  if(list.length>=8){const ch=list.slice().sort((a,b)=>a.d<b.d?-1:1);const half=Math.floor(ch.length/2);const s1=sdev(ch.slice(0,half).map(x=>x.v)),s2=sdev(ch.slice(-half).map(x=>x.v));const dd=s2-s1;
    h+=`<p class="small"><span class="delta ${dd<=-1?"up":dd>=1?"down":"flat"}">${dd<=-1?"▲":dd>=1?"▼":"■"}</span> ${dd<=-1?t("Rezultatai tampa pastovesni: svyravimas sumažėjo nuo ±{a} iki ±{b}.",{a:fmt1(s1),b:fmt1(s2)}):dd>=1?t("Rezultatai tapo mažiau pastovūs: svyravimas padidėjo nuo ±{a} iki ±{b}.",{a:fmt1(s1),b:fmt1(s2)}):t("Pastovumas beveik nesikeičia (±{b}).",{b:fmt1(s2)})}</p>`;}
  h+=`<p class="small muted">${t("Čempionate dažnai lemia ne geriausia, o blogiausia serija – stenkitės, kad apatinė riba kiltų.")}</p>`;
  return h+`</div>`;
}
function drawCharts(){
  const el=$("#ch-prog");if(!el)return;
  const f=S.f;const ss=filteredSessions(f);
  const pts=dayPts(ss,x=>(!f.a||x.a===f.a)&&(!f.d||x.d===f.d));
  pts.forEach((p,i)=>{const w=pts.slice(Math.max(0,i-4),i+1);let tw=0,tv=0;w.forEach(x=>{tw+=x.n;tv+=x.v*x.n;});p.ma=tv/tw;});
  const W=Math.max(280,el.clientWidth),H=220,ml=34,mr=10,mt=12,mb=28;
  const iw=W-ml-mr,ih=H-mt-mb;
  const T0=pts.length?pts[0].t:0,T1=pts.length?pts[pts.length-1].t:0;
  const XT=tt=>ml+(T1>T0?(tt-T0)/(T1-T0)*iw:iw/2);const X=i=>XT(pts[i].t),Y=v=>mt+ih-(v/100)*ih;
  let g="";
  [0,25,50,75,100].forEach(t=>{g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="${t===0?1.2:0.8}"/><text x="${ml-6}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${t}</text>`;});
  const nT=T1>T0?(W<420?4:6):1;
  for(let i=0;i<nT;i++){const tt=nT>1?T0+(T1-T0)*i/(nT-1):T0;const d=new Date(tt);const x=XT(tt);
    g+=`<line x1="${x}" x2="${x}" y1="${mt+ih}" y2="${mt+ih+4}" stroke="var(--line)"/><text x="${x}" y="${H-8}" text-anchor="${nT>1&&i===0?"start":nT>1&&i===nT-1?"end":"middle"}" font-size="11" fill="var(--muted)">${pad2(d.getDate())}.${pad2(d.getMonth()+1)}</text>`;}
  pts.forEach((p,i)=>{g+=`<circle cx="${X(i)}" cy="${Y(p.v)}" r="4.5" fill="var(--o1)" stroke="var(--surface)" stroke-width="2"/>`;});
  if(pts.length>1)g+=`<polyline points="${pts.map((p,i)=>X(i).toFixed(1)+","+Y(p.ma).toFixed(1)).join(" ")}" fill="none" stroke="var(--o5)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  const last=pts[pts.length-1];if(last&&pts.length>1){g+=`<circle cx="${X(pts.length-1)}" cy="${Y(last.ma)}" r="5" fill="var(--o5)" stroke="var(--surface)" stroke-width="2"/><text x="${X(pts.length-1)-8}" y="${Y(last.ma)-10}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">${fmt1(last.ma)}</text>`;}
  g+=`<line id="xh" x1="0" x2="0" y1="${mt}" y2="${mt+ih}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/><rect x="${ml}" y="0" width="${iw}" height="${H}" fill="transparent" id="hit"/>`;
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("Progreso grafikas")}">${g}</svg><div class="tip" id="tip" hidden></div>`;
  const hit=el.querySelector("#hit"),tip=el.querySelector("#tip"),xh=el.querySelector("#xh");
  const show=e=>{const r=el.getBoundingClientRect();const x=e.clientX-r.left;let bi=0,bd=1e9;pts.forEach((p,i)=>{const d=Math.abs(X(i)-x);if(d<bd){bd=d;bi=i;}});const p=pts[bi];if(!p)return;
    xh.setAttribute("x1",X(bi));xh.setAttribute("x2",X(bi));xh.setAttribute("visibility","visible");
    tip.hidden=false;tip.innerHTML=`${dateLt(p.date)}<br><b>${fmt1(p.v)}</b> / 100 · ${t("{n} met.",{n:p.n})}<br>${t("Vidurkis:")} ${fmt1(p.ma)}`;
    const tx=Math.min(Math.max(X(bi),80),W-80);tip.style.left=tx+"px";tip.style.top=(Math.min(Y(p.v),Y(p.ma))-8)+"px";};
  hit.addEventListener("pointermove",show);hit.addEventListener("pointerdown",show);
  hit.addEventListener("pointerleave",()=>{tip.hidden=true;xh.setAttribute("visibility","hidden");});
  const tr=$("#ch-trend");
  if(tr&&pts.length>=4){const tn=Math.max(2,Math.floor(pts.length/3));const a=avg(pts.slice(0,tn).map(p=>p.v)),b=avg(pts.slice(-tn).map(p=>p.v));const d=b-a;const c=Math.abs(d)<2?"flat":d>0?"up":"down";
    tr.innerHTML=`${t("Pirmų {k} treniruočių vidurkis <b>{a}</b>, paskutinių {k} – <b>{b}</b>:",{k:tn,a:fmt1(a),b:fmt1(b)})} <span class="delta ${c}">${c==="up"?t("▲ tobulėjate"):c==="down"?t("▼ rezultatai krito"):t("■ be esminio pokyčio")} (${d>0?"+":""}${fmt1(d)})</span>`;}
  else if(tr)tr.textContent=pts.length<4?t("Tendencijai reikia bent 4 treniruočių pasirinktame laikotarpyje."):"";
}

      else{const combos={};s.shots.forEach(x=>{const k=x.a+"|"+x.d;(combos[k]=combos[k]||[]).push(x.p);});body+=`<table class="tbl"><thead><tr><th>${t("Pratimas")}</th><th>${t("Metimai")}</th><th>${t("Vid.")}</th><th>${t("Pataik.")}</th></tr></thead><tbody>${Object.entries(combos).map(([k,v])=>{const[a,d]=k.split("|");return `<tr><td>${t("{a} rungtis, {d} m",{a,d})}</td><td>${v.length}</td><td>${fmt1(avg(v))}</td><td>${pct(v.filter(x=>x>0).length,v.length)} %</td></tr>`;}).join("")}</tbody></table>`;}
      if(!isDemo()){
        if(S.confirmDel===s.id)body+=`<div class="confirm"><span>${t("Ištrinti šią treniruotę ({n} metimai)? To atšaukti negalima.",{n:s.shots.length})}</span><div class="row"><button class="btn warn sm" data-act="h-del-yes" data-v="${s.id}">${t("Taip, ištrinti")}</button><button class="btn ghost sm" data-act="h-del-no">${t("Ne")}</button></div></div>`;

  const inp=$("#"+src);const name=(inp&&inp.value||"").trim();if(!name){inp&&inp.focus();return;}
  if(plFull()){S.limitHit=true;toast(t("Pasiektas {n} žaidėjų limitas",{n:PRO_MAX}));render();return;}
  const p={id:uid("p"),name,createdAt:Date.now(),archived:false};
  S.players.push(p);inp.value="";
  if(src==="sw-newpl"){addToGroup(p.id);}else{S.nf.pids=(S.nf.pids||[]).concat(p.id);keepForm();render();}
  await savePlayer(p);
}
async function saveFile(filename,data,mime){
  if(DL)return DL.save({filename,data});
  const blob=new Blob([data],{type:mime});
  try{const file=new File([blob],filename,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return;}}catch(e){if(e&&e.name==="AbortError")throw{code:"declined"};}
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function doExport(kind){
  try{
    if(kind==="json"){await saveFile(`tir-de-precision-${today()}.json`,JSON.stringify({version:1,exported:new Date().toISOString(),players:S.players,sessions:S.sessions},null,1),"application/json");}
    else{
      const rows=[[t("data"),t("zaidejas"),t("tipas"),t("rezimas"),t("serija"),t("rungtis"),t("atstumas_m"),t("rezultatas"),t("taskai"),t("klaidos_kryptis"),t("kontaktas"),t("vieta")]];
      S.sessions.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(s=>s.shots.forEach(x=>rows.push([s.date,playerName(s.playerId),KIND[s.kind]||"",s.mode==="full"?t("serija"):t("pratimas"),s.mode==="full"?x.s+1:"",x.a,x.d,OUT_LABEL[x.o]||x.o,x.p,x.m?DIR_LABEL[x.m]||x.m:"",x.c?CONTACT[x.c]:"",x.h?SIDE[x.h]:""])));
      const csv="﻿"+rows.map(r=>r.map(v=>{v=String(v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(";")).join("\n");
      await saveFile(`tir-de-precision-${t("metimai")}-${today()}.csv`,csv,"text/csv");
    }
    S.msg=t("Failas paruoštas.");
    if(kind==="json"){lsSet("tdp-lastbackup",Date.now());lsSet("tdp-backup-snooze",0);toast(t("Atsarginė kopija paruošta"));}
  }catch(e){S.msg=e&&e.code==="declined"?t("Atsisiuntimas atšauktas."):t("Nepavyko paruošti failo.");if(S.view!=="players")toast(S.msg);}
  render();
}
async function doImport(file){
  try{
    const txt=await file.text();const d=JSON.parse(txt);
    const P=Array.isArray(d.players)?d.players:[],SS=Array.isArray(d.sessions)?d.sessions:[];
    let np=0,ns=0;
    const norm=t=>String(t||"").trim().toLocaleLowerCase(LANG);const map={};let nm=0;
    for(const p of P){if(!p.id)continue;
      const same=S.players.find(x=>x.id===p.id)||S.players.find(x=>norm(x.name)===norm(p.name));
      if(same){map[p.id]=same.id;if(same.id!==p.id)nm++;continue;}
      const q={id:p.id,name:String(p.name||t("Be vardo")),createdAt:p.createdAt||Date.now(),archived:!!p.archived};S.players.push(q);map[p.id]=q.id;await savePlayer(q);np++;}
    for(const s of SS){if(!s.id||!Array.isArray(s.shots)||S.sessions.some(x=>x.id===s.id))continue;const q=clone(s);q.playerId=map[q.playerId]||q.playerId;q.updatedAt=Date.now();S.sessions.push(q);
      if(S.store==="db"){try{const b=clone(q);delete b.id;await DB.collection("sessions").doc(q.id).set(b);}catch(e){}}ns++;}
    if(S.store!=="db")saveLocalAll();
    S.msg=t("Įkelta: {s} treniruotės, {p} nauji žaidėjai",{s:ns,p:np})+(nm?t(", {n} sujungti pagal vardą",{n:nm}):"")+".";
  }catch(e){S.msg=t("Nepavyko perskaityti failo. Ar tai šios programėlės JSON kopija?");}
  render();
}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,v=b.dataset.v;
  switch(act){
    case"nav":S.view=v;lsSet("tdp-view",v);S.msg="";S.reflectId=null;S.reflectQ=[];S.rd=null;S.preFromStart=false;S.planEdit=null;render();window.scrollTo(0,0);break;
    case"nt-tab":{const ci=$("#co-in");if(ci)S.coachDraft=ci.value;}S.coachErr="";S.noteTab=v;S.planEdit=null;S.preFromStart=false;render();window.scrollTo(0,0);break;
    case"nt-p":{const ci=$("#co-in");if(ci)S.coachDraft=ci.value;}S.coachErr="";S.noteP=v;S.planEdit=null;render();break;
    case"pl-edit":{const p=notePlayer();if(p){S.planEdit=clone(planOf(p));render();}break;}
    case"pl-cancel":S.planEdit=null;render();break;
    case"pl-save":savePlan();break;
    case"pl-addrow":{collectPlan();const d=S.planEdit;if(!d)break;const k=b.dataset.k;if(k==="cue"&&d.cues.length<5)d.cues.push("");else if(k==="rit")d.ritual.push("");else if(k==="if")d.ifs.push({w:"",t:"",src:""});render();break;}
    case"pl-delrow":{collectPlan();const d=S.planEdit;if(!d)break;const i=+b.dataset.i;if(b.dataset.k==="rit")d.ritual.splice(i,1);else d.ifs.splice(i,1);render();break;}
    case"sug-add":{const p=notePlayer();if(!p)break;const sg=planSuggestions(p)[+v];if(!sg)break;const pl=planOf(p);p.plan={cues:pl.cues,ritual:pl.ritual,ifs:pl.ifs.concat([{w:sg.w,t:sg.t,src:"stat"}])};savePlayer(p);render();break;}
    case"rf-rate":keepReflect();if(S.rd){const k=b.dataset.k;S.rd[k]=S.rd[k]===+v?0:+v;}render();break;
    case"rf-tag":keepReflect();if(S.rd){const i=S.rd.tags.indexOf(v);if(i>=0)S.rd.tags.splice(i,1);else S.rd.tags.push(v);}render();break;
    case"rf-save":saveReflect();break;
    case"rf-skip":nextReflect();break;
    case"log-all":S.logAll=!S.logAll;render();break;
    case"log-empty":S.logEmpty=!S.logEmpty;render();break;
    case"rf-open":S.reflectBack="note";openReflect([v]);render();window.scrollTo(0,0);break;
    case"rf-ask":lsSet("tdp-reflect-off",v==="0");render();break;
    case"pre-start":{const p=notePlayer();if(S.preFromStart||active()){S.preFromStart=false;S.view="rec";}else{S.nf.kind="comp";if(p)S.nf.pids=[p.id];S.view="rec";}lsSet("tdp-view",S.view);render();window.scrollTo(0,0);break;}
    case"breath":openBreath();break;
    case"co-quick":coachSend(t(COACH_PROMPTS[+v]||""));break;
    case"co-send":{const ci=$("#co-in");coachSend(ci?ci.value:"");break;}
    case"co-clear":S.coachConfirmClear=true;renderCoach();break;
    case"co-clear-no":S.coachConfirmClear=false;renderCoach();break;
    case"co-clear-yes":{const p=coachPlayer();if(p)saveChat(p.id,[]);S.coachConfirmClear=false;S.coachMenu=false;S.coachErr="";renderCoach();break;}
    case"co-code":{const ci=$("#co-code");lsSet("tdp-coach-code",ci?ci.value.trim():"");S.coachNeedCode=false;S.coachErr="";renderCoach();break;}
    case"co-open":S.coachOpen=true;S.coachMenu=false;renderCoach();break;
    case"co-close":keepCoachDraft();S.coachOpen=false;S.coachMenu=false;S.coachConfirmClear=false;renderCoach();break;
    case"co-menu":S.coachMenu=!S.coachMenu;S.coachConfirmClear=false;renderCoach();break;
    case"co-ctx":lsSet("tdp-coach-ctx",!lsGet("tdp-coach-ctx",true));renderCoach();break;
    case"co-showcode":S.coachNeedCode=true;S.coachMenu=false;renderCoach();break;
    case"co-p":keepCoachDraft();S.coachP=v;S.coachErr="";renderCoach();break;
    case"ask-coach":S.coachOpen=true;S.coachMenu=false;if(v)S.coachP=v;S.coachDraft=t("Paaiškink mano pastebėjimus ir ką man treniruoti pirmiausia.");renderCoach();break;
    case"pal":setPalette(v);break;
    case"theme":lsSet("tdp-theme",v);if(v==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",v);render();break;
    case"fz":lsSet("tdp-fz",+v);document.documentElement.style.setProperty("--fz",v);render();break;
    case"bdg-all":S.badgesAll=!S.badgesAll;render();break;
    case"wr-off":S.wrOff=+v;render();break;
    case"wr-open":S.wrOff=+v;S.view="stats";lsSet("tdp-view","stats");if(b.dataset.p){S.f.player=b.dataset.p;lsSet("tdp-f",S.f);}lsSet("tdp-wr-seen",weekRange(+v)[0]);render();window.scrollTo(0,0);break;
    case"wr-coach":S.coachOpen=true;S.coachMenu=false;S.coachP=v;S.coachDraft=t(S.wrOff?"Parašyk mano praėjusios savaitės ataskaitą: kas pagerėjo, kas pablogėjo ir 2–3 konkretūs pratimai kitai savaitei.":"Parašyk mano šios savaitės ataskaitą: kas pagerėjo, kas pablogėjo ir 2–3 konkretūs pratimai kitai savaitei.");renderCoach();break;
    case"g-edit":S.goalEdit=v;render();break;
    case"g-cancel":S.goalEdit=null;render();break;
    case"g-save":saveGoal(v);break;
    case"g-del":{const p=S.players.find(x=>x.id===v);if(p){delete p.goal;S.goalEdit=null;savePlayer(p);render();}break;}
    case"g-drill":{if(active()){toast(t("Pirmiausia baikite dabartinę treniruotę"));S.view="rec";lsSet("tdp-view","rec");render();break;}S.nf.pids=[v];S.nf.mode="drill";S.nf.kind="train";S.nf.preCur={a:+b.dataset.a,d:+b.dataset.d};S.view="rec";lsSet("tdp-view","rec");render();window.scrollTo(0,0);toast(t("Pratimas paruoštas – {a} rungtis, {d} m. Paspauskite „Pradėti“.",{a:b.dataset.a,d:b.dataset.d}));break;}
    case"ed-pick":S.ed=v;lsSet("tdp-edition",v);S.pending=null;S.editing=false;S.coachOpen=false;
      if(v==="pro"&&S.activeId){const a=S.sessions.find(x=>x.id===S.activeId);if(a&&a.mode==="full"){S.cur=nextEmpty(a,curSeries(a),null)||{a:1,d:6};}}
      if(v==="free"&&S.fs&&!S.fs.done){S.cur=nextEmpty(S.fs,curSeries(S.fs),null)||{a:1,d:6};}
      render();window.scrollTo(0,0);break;
    case"ed-change":S.ed=null;lsSet("tdp-edition",null);S.coachOpen=false;render();window.scrollTo(0,0);break;
    case"free-start":freeStart();break;
    case"free-new":S.freeConfirm=true;render();break;
    case"free-new-no":S.freeConfirm=false;render();break;
    case"free-new-yes":freeReset();break;
    case"nf-player":{const p=S.nf.pids||[];const i=p.indexOf(v);if(i>=0)p.splice(i,1);else p.push(v);S.nf.pids=p;keepForm();render();break;}
    case"rot":S.group.rot=v;saveGroup();render();break;
    case"sw":S.pending=null;switchTo(v,false);render();break;
    case"sw-add":S.adding=!S.adding;render();break;
    case"sw-join":addToGroup(v);break;
    case"resume-all":{const open=S.sessions.filter(x=>!x.done).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));if(!open.length)break;S.group.ids=open.map(x=>x.id);saveGroup();S.curs={};S.activeId=null;switchTo(open[0].id,false);S.view="rec";lsSet("tdp-view","rec");render();window.scrollTo(0,0);break;}
    case"nf-mode":S.nf.mode=v;keepForm();render();break;
    case"nf-blk":{S.nf.blk=+v;lsSet("tdp-blk",+v);const multi=(S.nf.pids||[]).length>1;if(+v&&multi&&S.group.rot==="shot")S.group.rot="block";if(!+v&&S.group.rot==="block")S.group.rot="shot";saveGroup();keepForm();render();break;}
    case"nf-kind":S.nf.kind=v;S.nf.timed=null;keepForm();render();break;
    case"nf-timed":S.nf.timed=v==="1";keepForm();render();break;
    case"cd-start":{const x=S.sessions.find(y=>y.id===v);if(x){setCdStart(x,curSeries(x));persistSession(x);render();}break;}
    case"start":startSession();break;
    case"out":recordOutcome(v);break;
    case"det":setDetail(b.dataset.f,v);break;
    case"close-open":S.closePop=true;render();setTimeout(()=>{const x=document.querySelector('.pop [data-act="close-dir"]');x&&x.focus();},0);break;
    case"close-cancel":S.closePop=false;render();break;
    case"close-dir":closeSet(v);break;
    case"close-skip":closeSet(null);break;
    case"next":advance();break;
    case"cell":{S.closePop=false;const s=active();S.cur={a:+b.dataset.a,d:+b.dataset.d};S.pending=null;S.editing=s?findShot(s,curSeries(s),S.cur.a,S.cur.d)>=0:false;render();break;}
    case"dr-a":S.cur.a=+v;S.pending=null;S.group.blkStart=Date.now();saveGroup();render();break;
    case"dr-d":S.cur.d=+v;S.pending=null;S.group.blkStart=Date.now();saveGroup();render();break;
    case"undo":undo();break;
    case"end":endSession();break;
    case"series-new":{const g=groupSessions();const cur=active();const list=g.length?g:(cur?[cur]:[]);
      list.forEach(x=>{if(x.mode==="full"&&seriesShots(x,curSeries(x)).length>=20){x.series=(x.series||1)+1;persistSession(x);}});
      S.curs={};S.pending=null;S.editing=false;
      const first=list.find(x=>x.mode==="full"&&seriesShots(x,curSeries(x)).length<20)||list[0];
      if(first){if(first.id!==S.activeId)switchTo(first.id,list.length>1);const k=curSeries(first);S.cur=nextEmpty(first,k,null)||{a:1,d:6};}
      render();window.scrollTo(0,0);break;}
    case"f-player":case"f-period":case"f-kind":{const key=act.slice(2);S.f[key]=v;lsSet("tdp-f",S.f);render();break;}
    case"f-a":S.f.a=+v;lsSet("tdp-f",S.f);render();break;
    case"f-d":S.f.d=+v;lsSet("tdp-f",S.f);render();break;
    case"hm":{const F=isFree()?S.ff:S.f;const a=+b.dataset.a,d=+b.dataset.d;if(F.a===a&&F.d===d){F.a=0;F.d=0;}else{F.a=a;F.d=d;}if(!isFree())lsSet("tdp-f",S.f);render();break;}
    case"h-open":S.openHist=S.openHist===v?null:v;S.confirmDel=null;render();break;
    case"h-resume":{const s=S.sessions.find(x=>x.id===v);if(!s)break;s.done=false;if(!S.group.ids.includes(v)){S.group.ids.push(v);saveGroup();}setActive(v);S.view="rec";lsSet("tdp-view","rec");
      if(s.mode==="full"){const k=curSeries(s);S.cur=nextEmpty(s,k,null)||{a:1,d:6};}else{const l=s.shots[s.shots.length-1];S.cur=l?{a:l.a,d:l.d}:{a:1,d:6};}
      S.editing=false;render();window.scrollTo(0,0);break;}
    case"h-del":S.confirmDel=v;S.openHist=v;render();break;
    case"h-del-empty":S.confirmDel="__empty";render();break;
    case"h-del-empty-yes":{const fp=S.f.player;const ids=S.sessions.filter(s=>!s.shots.length&&s.id!==S.activeId&&(!fp||s.playerId===fp)).map(s=>s.id);S.confirmDel=null;Promise.all(ids.map(id=>deleteSession(id))).then(()=>{toast(t("Ištrinta: {n}",{n:ids.length}));render();});break;}
    case"h-kind":{const [id,k]=v.split("|");const x=S.sessions.find(y=>y.id===id);if(x&&x.kind!==k){x.kind=k;persistSession(x);toast(k==="comp"?t("Pažymėta kaip varžybos"):t("Pažymėta kaip treniruotė"));}render();break;}
    case"h-del-no":S.confirmDel=null;render();break;
    case"h-del-yes":S.confirmDel=null;S.openHist=null;deleteSession(v).then(render);render();break;
    case"pl-add":addPlayer(b.dataset.src);break;
    case"pl-rename":S.renaming=v;render();setTimeout(()=>{const i=$("#rn-"+v);i&&i.focus();},0);break;
    case"pl-rename-save":{const p=S.players.find(x=>x.id===v);const i=$("#rn-"+v);if(p&&i&&i.value.trim()){p.name=i.value.trim();savePlayer(p);}S.renaming=null;render();break;}
    case"pl-archive":{const p=S.players.find(x=>x.id===v);if(p){if(p.archived&&plFull()){toast(t("Pasiektas {n} žaidėjų limitas",{n:PRO_MAX}));break;}p.archived=!p.archived;savePlayer(p);render();}break;}
    case"exp-json":doExport("json");break;
    case"backup-later":lsSet("tdp-backup-snooze",Date.now()+SNOOZE_DAYS*864e5);render();break;
    case"exp-csv":doExport("csv");break;
    case"imp":$("#impfile").click();break;
    case"lang":if(v!==LANG){lsSet("tdp-lang",v);location.reload();}break;
  }
});
function keepForm(){const n=$("#nf-note"),d=$("#nf-date");if(n)S.nf.note=n.value;if(d&&d.value)S.nf.date=d.value;}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.closePop){S.closePop=false;render();return;}if(e.key==="Escape"&&S.coachOpen){keepCoachDraft();S.coachOpen=false;S.coachMenu=false;renderCoach();return;}if(e.key==="Enter"&&e.target.id&&["pl-new","pl-new-rec","nf-newpl","sw-newpl"].includes(e.target.id)){e.preventDefault();addPlayer(e.target.id);}});
$("#impfile").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)doImport(f);e.target.value="";});
let rsT;window.addEventListener("resize",()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(S.view==="stats"&&S.ed==="pro")drawCharts();},150);});
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(S.view==="stats")render();});}catch(e){}
new MutationObserver(()=>{if(S.view==="stats")render();}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

render();initStore();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
})();
