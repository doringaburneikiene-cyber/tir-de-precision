<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13202C">
<script>try{var tp=JSON.parse(localStorage.getItem("tdp-palette"));if(tp&&tp!=="steel")document.documentElement.setAttribute("data-palette",tp);}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tir de précision">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tir de précision dienynas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E7EBEE; --surface:#FBFCFC; --surface-2:#F0F3F5; --ink:#13202C; --ink-2:#4A5663; --muted:#7A8591;
  --line:#D3D9DE; --line-2:#BFC7CE;
  --accent:#E09A2A; --accent-strong:#94570A; --accent-soft:#FBEBD0;
  --btn:#13202C; --btn-ink:#FFFFFF;
  --o5:#104281; --o5-t:#FFFFFF; --o3:#2A78D6; --o3-t:#FFFFFF; --o1:#86B6EF; --o1-t:#0B2544; --o0:#C4CAD0; --o0-t:#13202C;
  --heat-0:#EEF4FC; --heat-1:#0D366B;
  --good:#006300; --bad:#B42F2F;
  --shadow:0 1px 2px rgba(19,32,44,.06),0 4px 14px rgba(19,32,44,.06);
  --r:14px;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1318; --surface:#172029; --surface-2:#1E2933; --ink:#EBF0F3; --ink-2:#ADB8C3; --muted:#7E8A96;
    --line:#2B3642; --line-2:#3A4755;
    --accent:#E7A847; --accent-strong:#F2BE6B; --accent-soft:#3A2C16;
    --btn:#EBF0F3; --btn-ink:#0E1318;
    --o5:#B7D3F6; --o5-t:#0B2544; --o3:#3987E5; --o3-t:#FFFFFF; --o1:#1C5CAB; --o1-t:#FFFFFF; --o0:#3A444F; --o0-t:#EBF0F3;
    --heat-0:#1B2733; --heat-1:#9EC5F4;
    --good:#3CC23C; --bad:#F07A7A;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1318; --surface:#172029; --surface-2:#1E2933; --ink:#EBF0F3; --ink-2:#ADB8C3; --muted:#7E8A96;
  --line:#2B3642; --line-2:#3A4755;
  --accent:#E7A847; --accent-strong:#F2BE6B; --accent-soft:#3A2C16;
  --btn:#EBF0F3; --btn-ink:#0E1318;
  --o5:#B7D3F6; --o5-t:#0B2544; --o3:#3987E5; --o3-t:#FFFFFF; --o1:#1C5CAB; --o1-t:#FFFFFF; --o0:#3A444F; --o0-t:#EBF0F3;
  --heat-0:#1B2733; --heat-1:#9EC5F4;
  --good:#3CC23C; --bad:#F07A7A;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:14px 110px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-cond);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:26px}
h2{font-size:21px}
h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--btn);color:var(--btn-ink);min-height:46px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.btn.warn{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;border-radius:999px;padding:8px 14px;min-height:40px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);box-shadow:none}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=date],textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:64px;resize:vertical}

/* top */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .label{color:var(--accent-strong)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.saving{background:var(--accent)} .dot.err{background:var(--bad)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-height:58px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--accent-strong)}

.banner{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner b{font-weight:700}
.banner.backup{flex-direction:column;gap:10px}

/* scoreboard */
.score-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.bigscore{font-family:var(--f-cond);font-weight:700;font-size:54px;line-height:.9;font-variant-numeric:tabular-nums}
.bigscore small{font-size:22px;color:var(--muted);font-weight:600}
.meta{display:flex;gap:14px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.meta b{font-family:var(--f-cond);font-size:19px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:minmax(76px,1.3fr) repeat(4,1fr) 44px;gap:4px;align-items:stretch}
.grid .h{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:2px}
.grid .h.l{text-align:left}
.grid .rl{display:flex;flex-direction:column;justify-content:center;font-size:12px;line-height:1.15;color:var(--ink-2)}
.grid .rl b{font-family:var(--f-cond);font-size:16px;color:var(--ink)}
.cell{border:0;border-radius:9px;min-height:42px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--f-cond);font-size:21px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;position:relative}
.cell.cur{box-shadow:inset 0 0 0 3px var(--accent)}
.cell.p5{background:var(--o5);color:var(--o5-t);box-shadow:none}
.cell.p3{background:var(--o3);color:var(--o3-t);box-shadow:none}
.cell.p1{background:var(--o1);color:var(--o1-t);box-shadow:none}
.cell.p0{background:var(--o0);color:var(--o0-t);box-shadow:none}
.cell.cur.p5,.cell.cur.p3,.cell.cur.p1,.cell.cur.p0{box-shadow:0 0 0 3px var(--accent)}
.cell .mk{position:absolute;right:4px;bottom:2px;font-family:var(--f-body);font-size:10px;font-weight:600;opacity:.85}
.rt{font-family:var(--f-cond);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}

.shot-title{display:flex;gap:14px;align-items:center}
.shot-title .diag{flex:0 0 76px}
.shot-title h2{font-size:24px}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{border:0;border-radius:12px;min-height:64px;padding:8px 12px;display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.out .pts{font-family:var(--f-cond);font-size:30px;font-weight:700;width:30px;text-align:center;flex:0 0 auto}
.out .t{display:flex;flex-direction:column;line-height:1.15}
.out .t b{font-size:16px}
.out .t span{font-size:12px;color:var(--ink-2)}
.out[aria-pressed="true"].o5{background:var(--o5);color:var(--o5-t);box-shadow:none}
.out[aria-pressed="true"].o3{background:var(--o3);color:var(--o3-t);box-shadow:none}
.out[aria-pressed="true"].o1{background:var(--o1);color:var(--o1-t);box-shadow:none}
.out[aria-pressed="true"].o0{background:var(--o0);color:var(--o0-t);box-shadow:none}
.out[aria-pressed="true"] .t span{color:inherit;opacity:.85}
.out.wide{grid-column:1/-1}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:360px;margin:0 auto;width:100%}
.pad button{border:0;border-radius:10px;min-height:58px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:600;line-height:1.15;padding:4px}
.pad button[aria-pressed="true"]{background:var(--ink);color:var(--surface);box-shadow:none}
.pad .ctr{padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:11px}
.pad .ctr svg{width:44px;height:44px}
.dir-note{text-align:center;font-size:12px;color:var(--muted)}

.sw{padding:10px;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.sw-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.pl-chip{flex:1 0 auto;min-width:96px;border:0;border-radius:12px;padding:8px 12px;min-height:54px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);text-align:left}
.pl-chip b{font-size:16px;line-height:1.1;white-space:nowrap}
.pl-chip span{font-size:12px;color:var(--ink-2);white-space:nowrap}
.pl-chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);box-shadow:inset 0 -4px 0 var(--accent)}
.pl-chip[aria-pressed="true"] span{color:inherit;opacity:.8}
.pl-chip.add{flex:0 0 auto;min-width:64px;align-items:center}
.pl-chip.add b{font-size:20px}
.rotrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:-4px}
.rotrow .chip{min-height:32px;padding:5px 11px;font-size:13px}
.thrower{font-size:14px;color:var(--accent-strong)}
.thrower b{font-size:17px;color:var(--ink)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-20px);background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:12px;font-weight:700;font-size:17px;opacity:0;pointer-events:none;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25);transition:opacity .2s,transform .2s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cel{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:rgba(10,16,22,.55)}
.cel-cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cel-card{position:relative;background:var(--surface);color:var(--ink);border-radius:20px;padding:24px 20px 18px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.cel-card h2{font-size:30px}
.cel-card p{color:var(--ink-2);font-size:15px}
.cel-badge{width:76px;height:76px;margin:0 auto 4px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center}
.cel-badge svg{width:42px;height:42px}
@media (prefers-reduced-motion:no-preference){.cel-card{animation:celpop .4s cubic-bezier(.2,1.4,.4,1)}}
@keyframes celpop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.week{display:flex;flex-direction:column;gap:10px}
.week-row{display:grid;grid-template-columns:minmax(70px,1fr) auto auto;gap:10px;align-items:center}
.week-row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wdots{display:flex;gap:4px}
.wdot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.wdot.on{background:var(--o3);color:var(--o3-t);box-shadow:none}
.wdot.today{box-shadow:inset 0 0 0 2px var(--accent)}
.wdot.on.today{box-shadow:0 0 0 2px var(--accent)}
.wcount{font-family:var(--f-cond);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.wcount.goal{color:var(--good)}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.sdot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-cond);font-weight:700;font-size:14px}
.sdot.p5{background:var(--o5);color:var(--o5-t)} .sdot.p3{background:var(--o3);color:var(--o3-t)} .sdot.p1{background:var(--o1);color:var(--o1-t)} .sdot.p0{background:var(--o0);color:var(--o0-t)}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-cond);font-weight:700;font-size:34px;line-height:1}
.kpi .v small{font-size:16px;color:var(--muted);font-weight:600}
.delta{font-size:12px;font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.flat{color:var(--muted)}
.filters{display:flex;flex-direction:column;gap:10px}
.filters .chip{min-height:36px;padding:6px 12px;font-size:13px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.3;white-space:nowrap;transform:translate(-50%,-100%);z-index:3}
.tip b{font-size:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.legend i.ln{height:3px;border-radius:2px;vertical-align:3px;width:16px}
.legend i.cr{border-radius:50%}
.scroll-x{overflow-x:auto}
.heat{display:grid;grid-template-columns:minmax(66px,1.1fr) repeat(5,minmax(44px,1fr));gap:4px;min-width:310px}
.heat .h{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.heat .h.l{text-align:left}
.heat .rl{font-size:12px;line-height:1.15;color:var(--ink-2);display:flex;flex-direction:column;justify-content:center}
.heat .rl b{font-family:var(--f-cond);font-size:15px;color:var(--ink)}
.hc{border:0;border-radius:8px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.hc{padding:2px}
.hc b{font-family:var(--f-cond);font-size:19px;line-height:1}
.hc span{font-size:10px;opacity:.8}
.hc.sel{box-shadow:0 0 0 3px var(--accent)}
.hc.tot{background:var(--surface-2)!important;color:var(--ink)!important}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center}
.bar-row .rl{font-size:12px;line-height:1.15;color:var(--ink-2)}
.bar-row .rl b{font-family:var(--f-cond);font-size:15px;color:var(--ink)}
.sbar{display:flex;gap:2px;height:26px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.sbar div{height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;min-width:0;overflow:hidden}
.compass{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:340px;width:100%;margin:0 auto}
.compass div{border-radius:9px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;font-size:11px;line-height:1.15}
.compass div b{font-family:var(--f-cond);font-size:22px;line-height:1}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.insight{display:flex;flex-direction:column;gap:6px}
.insight li{margin-left:18px}
ul.insight{padding:0;margin:0}

/* history */
.hist-item{display:flex;flex-direction:column;gap:10px}
.hist-head{border:0;background:none;padding:0;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%}
.hist-head .sc{font-family:var(--f-cond);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.hist-head .sc small{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.tag.comp{background:var(--accent-soft);color:var(--accent-strong)}
.confirm{background:var(--surface-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.rules dt{font-weight:700;margin-top:8px}
.rules dd{margin:2px 0 0 0;color:var(--ink-2);font-size:14px}
@media (prefers-reduced-motion:no-preference){.cell,.out,.chip{transition:background-color .12s,box-shadow .12s}}
/* notebook */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--line);border-radius:12px;padding:4px}
.seg button{border:0;border-radius:9px;background:transparent;color:var(--ink-2);font-weight:600;font-size:13px;min-height:38px;padding:4px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.cues{display:flex;flex-wrap:wrap;gap:8px}
.cue{background:var(--ink);color:var(--surface);border-radius:999px;padding:9px 14px;font-size:15px;font-weight:600}
ol.ritual{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ol.ritual li{display:flex;gap:10px;align-items:center;font-size:15px}
.rn{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-family:var(--f-cond);font-weight:700;font-size:15px}
.ifs{display:flex;flex-direction:column;gap:8px}

.pre-if{font-size:15px;line-height:1.35}
.pre-if span{color:#ADB8C3}
.pre-card{background:#1E2A36;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.pre-best{font-family:var(--f-cond);font-weight:700;font-size:22px;color:#FFFFFF}
.pre-best small{font-size:13px;color:#ADB8C3}
.pre-warn{background:#2A2416;border-radius:12px;padding:10px 12px;font-size:14px;color:#F5E6CC}
.btn.pre-go{background:#E7A847;color:#101A24;min-height:52px;font-size:17px}
.btn.pre-ghost{background:transparent;color:#EBF0F3;box-shadow:inset 0 0 0 1.5px #3A4755}
.breath .cel-card{gap:14px}
.bcirc{width:180px;height:180px;margin:6px auto;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center}

<body>


<div class="wrap" id="app"><div class="card"><p class="muted">Kraunama…</p></div></div>

<script src="i18n.js"></script>
<script>
(function(){
"use strict";

/* ---------- i18n ---------- */
const I18N=window.TDP_I18N||{};
const LANGS=[["lt","Lietuvių"],["en","English"],["fr","Français"]];
let LANG=(function(){let v=null;try{v=JSON.parse(localStorage.getItem("tdp-lang"));}catch(e){}
  if(v&&LANGS.some(l=>l[0]===v))return v;const n=String(navigator.language||"en").slice(0,2).toLowerCase();return n==="lt"?"lt":n==="fr"?"fr":"en";})();
function t(str,vars){let r=LANG==="lt"?str:((I18N[LANG]&&I18N[LANG][str]!=null)?I18N[LANG][str]:str);
  if(vars)r=r.replace(/\{(\w+)\}/g,(m,k)=>vars[k]!=null?vars[k]:m);return r;}
document.documentElement.lang=LANG;
try{document.title=t("Tir de précision dienynas");}catch(e){}

/* ---------- Domain ---------- */
const DIST=[6,7,8,9];
const AT=[
 {n:1,name:"Vienas rutulys",desc:"Rutulys-taikinys apskritimo centre, be kliūčių.",outs:[
   {k:"carreau",p:5,l:"Karo",s:"Taikinys išėjo, mano rutulys liko"},
   {k:"reussi",p:3,l:"Išmušė",s:"Abu rutuliai išėjo"},
   {k:"touche",p:1,l:"Palietė",s:"Taikinys liko apskritime"},
   {k:"miss",p:0,l:"Nepataikė",s:"0 taškų"}]},
 {n:2,name:"Rutulys už taikinuko",desc:"Priekyje taikinukas (kliūtis), už jo 10 cm – rutulys-taikinys.",outs:null},
 {n:3,name:"Rutulys tarp dviejų",desc:"Rutulys-taikinys centre, kliūtys iš kairės ir dešinės (3 cm).",outs:null},
 {n:4,name:"Rutulys už rutulio",desc:"Priekyje rutulys-kliūtis, už jo 10 cm – taikinys. Reikia peršokti.",outs:null},
 {n:5,name:"Taikinukas",desc:"Taikinukas 20 cm nuo priekinio apskritimo krašto.",outs:[
   {k:"out",p:5,l:"Išmušė",s:"Taikinukas išėjo iš apskritimo"},
   {k:"moved",p:3,l:"Pajudino",s:"Liko apskritime"},
   {k:"miss",p:0,l:"Nepataikė",s:"0 taškų",wide:true}]}
];
/* FIPJP 2025: 2 ir 4 rungtyse 1 t., kai kliūtis paliečiama grįžtant, pirma pataikius taikinį
   (ir kritimas buvo už priekinės kliūties); 3 rungtyje 1 t., kai po taikinio paliesta kliūtis
   lieka apskritime, o 0 t., kai ir taikinys, ir kliūtis išeina iš apskritimo. */
const OUTS_24=[
 {k:"carreau",p:5,l:"Karo",s:"Kliūčių nelietė, mano rutulys liko"},
 {k:"reussi",p:3,l:"Išmušė",s:"Abu išėjo, kliūčių nelietė"},
 {k:"touche",p:1,l:"Palietė",s:"Taikinys liko apskritime"},
 {k:"obst",p:1,l:"Kliūtis grįžtant",s:"Pirma taikinys, po to kliūtis (kritimas už kliūties)"},
 {k:"miss",p:0,l:"Nepataikė",s:"0 taškų",wide:true}];
const OUTS_3=[
 {k:"carreau",p:5,l:"Karo",s:"Kliūčių nelietė, mano rutulys liko"},
 {k:"reussi",p:3,l:"Išmušė",s:"Abu išėjo, kliūčių nelietė"},
 {k:"touche",p:1,l:"Palietė",s:"Taikinys liko apskritime"},
 {k:"obst",p:1,l:"Kliūtis liko",s:"Po taikinio palietė kliūtį, ji liko apskritime"},
 {k:"obstout",p:0,l:"Kliūtis išėjo",s:"Taikinys ir kliūtis išėjo – 0 taškų"},
 {k:"miss",p:0,l:"Nepataikė",s:"0 taškų"}];
AT[1].outs=OUTS_24;AT[2].outs=OUTS_3;AT[3].outs=OUTS_24;
const OUT_LABEL={carreau:"Karo",reussi:"Išmušė",touche:"Palietė",obst:"Kliūtis (1 t.)",obstout:"Taikinys ir kliūtis išėjo (0 t.)",miss:"Nepataikė",out:"Išmušė taikinuką",moved:"Pajudino taikinuką"};
const DIRS=[["NW","Toli ir kairėn"],["N","Per toli"],["NE","Toli ir dešinėn"],["W","Kairėn"],["C","Arti / kita"],["E","Dešinėn"],["SW","Trumpai ir kairėn"],["S","Per trumpai"],["SE","Trumpai ir dešinėn"]];
AT.forEach(a=>{a.name=t(a.name);a.desc=t(a.desc);});
[AT[0].outs,OUTS_24,OUTS_3,AT[4].outs].forEach(list=>list.forEach(o=>{o.l=t(o.l);o.s=t(o.s);}));
DIRS.forEach(d=>{d[1]=t(d[1]);});
Object.keys(OUT_LABEL).forEach(k=>{OUT_LABEL[k]=t(OUT_LABEL[k]);});
const DIR_LABEL=Object.fromEntries(DIRS);DIR_LABEL.OB=t("Pirma kliūtis");DIR_LABEL.NM=t("Palietė, nepajudino");
const CONTACT={F:t("Tiesiai į rutulį"),B:t("Su atšokimu")};
const SIDE={L:t("Kairė"),C:t("Centras"),R:t("Dešinė")};
const KIND={train:t("Treniruotė"),comp:t("Varžybos")};
const ORDER=[];AT.forEach(a=>DIST.forEach(d=>ORDER.push([a.n,d])));

/* ---------- Utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const today=()=>ymd(new Date());
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const fmt1=v=>{if(v==null||isNaN(v))return"—";const x=(Math.round(v*10)/10).toFixed(1);return LANG==="en"?x:x.replace(".",",");};
const fmt0=v=>v==null||isNaN(v)?"—":String(Math.round(v));
const pct=(a,b)=>b?Math.round(a/b*100):null;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const dateLt=s=>{if(!s)return"";const[y,m,d]=s.split("-");return d+"."+m+"."+y.slice(2)};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function lsGet(k,def){try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v)}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- State ---------- */
const S={
  store:"pending", ro:false, players:[], sessions:[], status:"ok",
  view:lsGet("tdp-view","rec"), activeId:lsGet("tdp-active",null),
  cur:{a:1,d:6}, pending:null, editing:false,
  nf:{pids:null,mode:"full",kind:"train",date:today(),note:""},
  group:Object.assign({ids:[],rot:"shot"},lsGet("tdp-group",{})), curs:{}, adding:false, fix:false,
  f:Object.assign({player:"",period:"90",kind:"all",a:0,d:0},lsGet("tdp-f",{})),
  openHist:null, confirmDel:null, renaming:null, msg:"",
  noteTab:"plan", noteP:null, planEdit:null, reflectQ:[], reflectId:null, rd:null, preFromStart:false, reflectBack:null
};
let DB=null, DL=null;

/* ---------- Storage layer ---------- */
const saveQ=new Map();
function setStatus(s){S.status=s;const el=$("#st");if(el)el.outerHTML=statusHtml();}
function statusHtml(){
  const m={ok:["ok",S.store==="db"?t("Išsaugota"):t("Išsaugota įrenginyje")],saving:["saving",t("Saugoma…")],err:["err",t("Nepavyko išsaugoti – bandoma dar")],ro:["err",t("Tik peržiūra")]};
  const [c,txt]=S.ro?m.ro:(m[S.status]||m.ok);
  return `<span class="status" id="st"><span class="dot ${c}"></span>${txt}</span>`;
}
function saveLocalAll(){lsSet("tdp-data",{players:S.players,sessions:S.sessions});}
function persistSession(sess){
  sess.updatedAt=Date.now();
  if(S.store!=="db"){saveLocalAll();setStatus("ok");return;}
  let q=saveQ.get(sess.id);if(!q){q={};saveQ.set(sess.id,q);}
  clearTimeout(q.timer);setStatus("saving");
  q.timer=setTimeout(()=>{q.timer=null;flush(sess.id);},350);
}
async function flush(id){
  const q=saveQ.get(id);if(!q)return;
  if(q.inflight){q.dirty=true;return;}
  const sess=S.sessions.find(x=>x.id===id);
  if(!sess){saveQ.delete(id);return;}
  q.inflight=true;q.dirty=false;
  const body=clone(sess);delete body.id;
  try{await DB.collection("sessions").doc(id).set(body);setStatus("ok");}
  catch(e){
    if(e&&e.code==="invalid_argument"){S.ro=true;setStatus("err");q.inflight=false;saveQ.delete(id);render();return;}
    setStatus("err");q.dirty=true;await sleep(2500+Math.random()*1000);
  }
  q.inflight=false;
  if(q.dirty)flush(id);else if(!q.timer)saveQ.delete(id);
}
async function savePlayer(p){
  if(S.store!=="db"){saveLocalAll();return;}
  const body=clone(p);delete body.id;
  try{setStatus("saving");await DB.collection("players").doc(p.id).set(body);setStatus("ok");}
  catch(e){setStatus("err");if(e&&e.code==="invalid_argument"){S.ro=true;render();}}
}
async function deleteSession(id){
  S.sessions=S.sessions.filter(s=>s.id!==id);saveQ.delete(id);
  if(S.activeId===id)setActive(null);
  if(S.store!=="db"){saveLocalAll();return;}
  try{await DB.collection("sessions").doc(id).delete();}catch(e){setStatus("err");}
}
function mergeSnap(list,snap){
  const map=new Map(list.map(s=>[s.id,s]));const seen=new Set();const next=[];
  for(const d of snap.docs){
    seen.add(d.id);const data=d.data();const local=map.get(d.id);
    if(local&&(saveQ.has(d.id)||(local.updatedAt||0)>(data.updatedAt||0)))next.push(local);
    else next.push(Object.assign(clone(data),{id:d.id}));
  }
  for(const [id,s] of map)if(!seen.has(id)&&saveQ.has(id))next.push(s);
  return next;
}
async function initStore(){
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null;}catch(e){db=null;}
  try{DL=window.claude&&window.claude.use?await window.claude.use("downloads"):null;}catch(e){DL=null;}
  if(db){
    DB=db;S.store="db";
    let gotP=false,gotS=false;
    DB.collection("players").onSnapshot(snap=>{S.players=mergeSnap(S.players,snap);gotP=true;if(gotS)scheduleRender();},e=>{S.status="err";scheduleRender();});
    DB.collection("sessions").onSnapshot(snap=>{S.sessions=mergeSnap(S.sessions,snap);gotS=true;if(gotP)scheduleRender();},e=>{S.status="err";scheduleRender();});
  }else{
    S.store="local";const d=lsGet("tdp-data",{players:[],sessions:[]});
    S.players=d.players||[];S.sessions=d.sessions||[];render();
  }
}

/* ---------- Render scheduling ---------- */
let renderPending=false;
function scheduleRender(){
  const ae=document.activeElement;
  if(ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")&&ae.type!=="file"){renderPending=true;return;}
  render();
}
document.addEventListener("focusout",()=>{if(renderPending){renderPending=false;setTimeout(render,0);}});

/* ---------- Helpers on data ---------- */
const activePlayers=()=>S.players.filter(p=>!p.archived).sort((a,b)=>(a.name||"").localeCompare(b.name||"",LANG));
const playerName=id=>{const p=S.players.find(x=>x.id===id)||DEMO.players.find(x=>x.id===id);return p?p.name:t("Nežinomas");};
function active(){return S.activeId?S.sessions.find(s=>s.id===S.activeId)||null:null;}
function setActive(id){S.activeId=id;lsSet("tdp-active",id);S.pending=null;}
const curSeries=s=>Math.max(0,(s.series||1)-1);
function seriesShots(s,k){return s.shots.filter(x=>x.s===k);}
function findShot(s,k,a,d){return s.shots.findIndex(x=>x.s===k&&x.a===a&&x.d===d);}
function nextEmpty(s,k,from){
  const start=from?ORDER.findIndex(o=>o[0]===from.a&&o[1]===from.d):-1;
  for(let i=1;i<=ORDER.length;i++){const [a,d]=ORDER[(start+i+ORDER.length)%ORDER.length];if(findShot(s,k,a,d)<0)return{a,d};}
  return null;
}
function seriesTotals(s){
  const out=[];for(let k=0;k<(s.series||1);k++){const sh=seriesShots(s,k);if(sh.length)out.push({k,n:sh.length,sum:sh.reduce((x,y)=>x+y.p,0),t0:Math.min(...sh.map(x=>x.t||0)),t1:Math.max(...sh.map(x=>x.t||0))});}
  return out;
}
function sessScore(s){const p=s.shots.map(x=>x.p);return p.length?avg(p)*20:null;}

/* ---------- Demo data (never written) ---------- */
const DEMO=(function(){
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646;};
  const players=[{id:"demo1",name:t("Jonas (pavyzdys)")},{id:"demo2",name:t("Rūta (pavyzdys)")}];
  const sessions=[];const now=new Date();
  players.forEach((pl,pi)=>{
    for(let i=0;i<24;i++){
      const dt=new Date(now);dt.setDate(dt.getDate()-(118-i*5)-pi);
      const prog=i/23, skill=(pi?0.52:0.47)+prog*0.16;
      const shots=[];
      ORDER.forEach(([a,d])=>{
        const diff=[0,0.05,0.1,0.14,0.08][a-1]+(d-6)*0.07;
        const pHit=Math.max(0.1,Math.min(0.95,skill+0.2-diff));
        let o,p,sh={a,d,s:0,t:dt.getTime()};
        if(rnd()<pHit){
          sh.c=rnd()<0.75?"F":"B";sh.h=rnd()<0.6?"C":(rnd()<0.5?"L":"R");
          if(a===5){o=rnd()<0.6?"out":"moved";p=o==="out"?5:3;}
          else{const r=rnd();const pc=0.28+prog*0.14+(sh.h==="C"?0.1:-0.1);
            if(r<pc){o="carreau";p=5}else if(r<pc+0.4){o="reussi";p=3}else if(a>1&&r<pc+0.5){o="obst";p=1}else{o="touche";p=1}}
        }else{
          o="miss";p=0;const r=rnd();
          if(a>1&&a<5&&r<0.18)sh.m="OB";else{
            const shortB=d>=8?0.5:0.35;const lng=rnd()<shortB?"S":(rnd()<0.45?"N":"");
            const lat=rnd()<0.55?(rnd()<(pi?0.4:0.62)?"W":"E"):"";
            sh.m=(lng+lat)||"C";
            if(sh.m==="SW"||sh.m==="SE"||sh.m==="NW"||sh.m==="NE"||["N","S","W","E","C"].includes(sh.m));else sh.m="C";
          }
        }
        sh.o=o;sh.p=p;shots.push(sh);
      });
      sessions.push({id:"d"+pi+"_"+i,playerId:pl.id,date:ymd(dt),kind:i%6===5?"comp":"train",mode:"full",series:1,shots,createdAt:dt.getTime()});
    }
  });
  return{players,sessions};
})();

const CEL=[];let celOpen=false;
function celebrate(icon,title,text){CEL.push({icon,title,text});if(!celOpen)nextCel();}
function nextCel(){
  const c=CEL.shift();if(!c){celOpen=false;return;}celOpen=true;
  const ov=document.createElement("div");ov.className="cel";ov.setAttribute("role","dialog");ov.setAttribute("aria-modal","true");
  ov.innerHTML=`<canvas class="cel-cv" aria-hidden="true"></canvas><div class="cel-card"><div class="cel-badge">${CEL_ICON[c.icon]||CEL_ICON.star}</div><h2>${esc(c.title)}</h2><p>${c.text}</p><button class="btn block" type="button">${t("Ačiū!")}</button></div>`;
  document.body.appendChild(ov);
  try{navigator.vibrate&&navigator.vibrate([70,50,70,50,180]);}catch(e){}
  let reduce=false;try{reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
  const stop=reduce?()=>{}:confetti(ov.querySelector("canvas"));
  const btn=ov.querySelector("button");btn.focus();
  btn.addEventListener("click",()=>{stop();ov.remove();nextCel();});
}
function confetti(cv){
  const ctx=cv.getContext("2d");if(!ctx)return()=>{};
  const dpr=Math.min(2,window.devicePixelRatio||1);const W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement);const cols=["--accent","--o3","--o5","--o1","--good"].map(v=>cs.getPropertyValue(v).trim()||"#E09A2A");
  const P=[];for(let i=0;i<150;i++)P.push({x:W/2+(Math.random()-.5)*60,y:H*0.35,vx:(Math.random()-.5)*12,vy:-Math.random()*13-4,r:Math.random()*6+4,a:Math.random()*6.28,va:(Math.random()-.5)*.3,c:cols[i%cols.length]});
  let raf=0,t0=performance.now();
  const step=now=>{const el=now-t0;ctx.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.globalAlpha=Math.max(0,1-el/3200);ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore();});
    if(el<3200)raf=requestAnimationFrame(step);else ctx.clearRect(0,0,W,H);};
  raf=requestAnimationFrame(step);
  return()=>cancelAnimationFrame(raf);
}
function celDone(key){const l=lsGet("tdp-cel",[]);if(l.includes(key))return true;l.push(key);lsSet("tdp-cel",l.slice(-300));return false;}
function checkSeriesRecord(s,k){
  const sh=seriesShots(s,k);if(sh.length<20)return;
  const sum=sh.reduce((x,y)=>x+y.p,0);
  const prev=S.sessions.filter(x=>x.playerId===s.playerId&&x.mode==="full").flatMap(x=>seriesTotals(x).filter(tt=>tt.n===20&&!(x.id===s.id&&tt.k===k)).map(tt=>tt.sum));
  const name=esc(playerName(s.playerId));
  if(sum===100){if(!celDone("pb:"+s.id+":"+k))celebrate("trophy",t("Tobula serija!"),t("{name}, 100 taškų iš 100. Tai maksimalus įmanomas rezultatas!",{name}));return;}
  if(!prev.length)return;
  const best=Math.max(...prev);
  if(sum>best&&!celDone("pb:"+s.id+":"+k))celebrate("trophy",t("Naujas rekordas!"),t("{name}, <b>{sum}</b> taškų – geriau nei ankstesnis geriausias rezultatas ({best}). Puikiai!",{name,sum,best}));
}
function weekStart(){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d;}
function weekDays(pid){
  const mon=weekStart();const days=[];for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);days.push(ymd(d));}
  const set=new Set(S.sessions.filter(x=>x.playerId===pid&&x.shots&&x.shots.length&&days.includes(x.date)).map(x=>x.date));

function gridHtml(s,k){

function seriesSummary(s,k){
  const sh=seriesShots(s,k);const sum=sh.reduce((x,y)=>x+y.p,0);
  const dur=(Math.max(...sh.map(x=>x.t))-Math.min(...sh.map(x=>x.t)))/1000;
  const byA=AT.map(a=>sh.filter(x=>x.a===a.n).reduce((x,y)=>x+y.p,0));
  const byD=DIST.map(d=>sh.filter(x=>x.d===d).reduce((x,y)=>x+y.p,0));
  const prev=dataSessions().filter(x=>x.playerId===s.playerId&&x.mode==="full").flatMap(x=>seriesTotals(x).filter(t=>t.n===20&&!(x.id===s.id&&t.k===k)).map(t=>t.sum));
  const best=prev.length?Math.max(...prev):null;
  return `<div class="card"><span class="label">${t("Serija {n} baigta",{n:k+1})}</span>
   <div class="row between"><div class="bigscore num">${sum}<small> / 100</small></div><div class="meta"><span>${t("Trukmė")}<br><b>${Math.floor(dur/60)}:${pad2(Math.round(dur%60))}</b></span><span>${t("Asmeninis rekordas")}<br><b>${best==null?"—":best}</b></span></div></div>
   ${best!=null&&sum>best?`<div class="banner"><span>${t("<b>Naujas asmeninis rekordas!</b> Ankstesnis buvo {b}.",{b:best})}</span></div>`:""}
   <table class="tbl"><thead><tr><th>${t("Rungtis")}</th><th>${t("Taškai")}</th><th>${t("iš")}</th></tr></thead><tbody>${AT.map((a,i)=>`<tr><td>${a.n}. ${esc(a.name)}</td><td><b>${byA[i]}</b></td><td class="muted">20</td></tr>`).join("")}</tbody></table>
   <p class="small ink2">${t("Pagal atstumą:")} ${DIST.map((d,i)=>`${d} m – <b>${byD[i]}</b>`).join(" · ")} ${t("(iš 25)")}</p>
   ${groupBoard()}
   <div class="row"><button class="btn" data-act="series-new" style="flex:1">${groupSessions().length>1?t("Nauja serija visiems"):t("Nauja serija")}</button><button class="btn ghost" data-act="end" style="flex:1">${t("Baigti treniruotę")}</button></div>
  </div>`;
}
function groupBoard(){
  const g=groupSessions().filter(x=>x.mode==="full");if(g.length<2)return"";
  const rows=g.map(x=>{const sh=seriesShots(x,curSeries(x));return{x,n:sh.length,sum:sh.reduce((a,b)=>a+b.p,0)};}).sort((a,b)=>b.sum-a.sum);
  return `<table class="tbl"><thead><tr><th>${t("Žaidėjas")}</th><th>${t("Metimai")}</th><th>${t("Taškai")}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(playerName(r.x.playerId))}</td><td>${r.n}/20</td><td><b>${r.sum}</b></td></tr>`).join("")}</tbody></table>${rows.some(r=>r.n<20)?`<p class="small muted">${t("Dar ne visi baigė seriją – pasirinkite žaidėją viršuje.")}</p>`:""}`;
}
let timerInt=null;
function tickTimer(){
  clearInterval(timerInt);const el=$("#timer");if(!el)return;
  const f=()=>{const t0=+el.dataset.t0;if(!t0){el.textContent="0:00";return;}const s=Math.max(0,Math.floor((Date.now()-t0)/1000));el.textContent=Math.floor(s/60)+":"+pad2(s%60);};
  f();timerInt=setInterval(()=>{if(!document.body.contains(el)){clearInterval(timerInt);return;}f();},1000);

/* ----- Recording actions ----- */
function saveGroup(){lsSet("tdp-group",S.group);}
function groupSessions(){return S.group.ids.map(id=>S.sessions.find(x=>x.id===id)).filter(x=>x&&!x.done);}
function switchTo(id,announce){
  if(id===S.activeId)return;const s=S.sessions.find(x=>x.id===id);if(!s)return;
  if(S.activeId)S.curs[S.activeId]=Object.assign({},S.cur);
  setActive(id);S.editing=false;S.adding=false;
  if(s.mode==="full"){const c=S.curs[id];const k=curSeries(s);S.cur=c&&findShot(s,k,c.a,c.d)<0?c:(nextEmpty(s,k,null)||{a:1,d:6});}
  if(announce)toast(t("Dabar meta: {name}",{name:playerName(s.playerId)}));
}
function rotate(){
  const g=groupSessions();if(g.length<2)return;const i=g.findIndex(x=>x.id===S.activeId);
  for(let j=1;j<g.length;j++){const s=g[(i+j)%g.length];if(s.mode!=="full"||seriesShots(s,curSeries(s)).length<20){switchTo(s.id,true);return;}}
}
let toastT;
function toast(t){let el=$("#toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}
  el.textContent=t;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),1600);}
function newSessionFor(pid,base){
  return {id:uid("s"),playerId:pid,date:base.date,kind:base.kind,mode:base.mode,series:1,note:base.note||"",shots:[],createdAt:Date.now(),updatedAt:Date.now(),done:false};
}
function startSession(){
  const nf=S.nf;const note=$("#nf-note");const dt=$("#nf-date");
  if(note)nf.note=note.value;if(dt&&dt.value)nf.date=dt.value;
  if(!nf.pids||!nf.pids.length)return;
  lsSet("tdp-lastps",nf.pids);
  const base={date:nf.date||today(),kind:nf.kind,mode:nf.mode,note:nf.note.trim()};
  const made=nf.pids.map(pid=>newSessionFor(pid,base));
  made.forEach(x=>{S.sessions.push(x);persistSession(x);});
  S.group.ids=made.map(x=>x.id);saveGroup();S.curs={};
  setActive(made[0].id);S.cur={a:1,d:6};S.editing=false;nf.note="";
  if(nf.kind==="comp"){const pp=S.players.find(x=>x.id===nf.pids[0]);if(pp&&planHas(pp)){S.view="note";S.noteTab="pre";S.noteP=pp.id;S.preFromStart=true;S.planEdit=null;}}
  render();window.scrollTo(0,0);
}
function addToGroup(pid){
  const cur=active();if(!cur)return;
  const ex=groupSessions().find(x=>x.playerId===pid);if(ex){switchTo(ex.id,true);render();return;}
  const x=newSessionFor(pid,cur);S.sessions.push(x);persistSession(x);
  S.group.ids.push(x.id);saveGroup();S.adding=false;
  if(cur.mode==="full")S.curs[x.id]={a:1,d:6};
  switchTo(x.id,true);render();
}
function recordOutcome(key){
  const s=active();if(!s)return;const a=AT[S.cur.a-1];const o=a.outs.find(x=>x.k===key);if(!o)return;
  const k=curSeries(s);let idx=S.pending;
  if(idx==null&&s.mode==="full"){const i=findShot(s,k,a.n,S.cur.d);if(i>=0){idx=i;S.fix=true;}}
  if(idx!=null&&s.shots[idx]){
    const sh=s.shots[idx];const changedKind=(sh.o==="miss")!==(o.k==="miss");
    sh.o=o.k;sh.p=o.p;if(changedKind){delete sh.m;delete sh.c;delete sh.h;}
    S.pending=idx;
  }else{
    s.shots.push({a:a.n,d:S.cur.d,s:s.mode==="full"?k:0,o:o.k,p:o.p,t:Date.now()});
    S.pending=s.shots.length-1;S.fix=false;
    let run=0;for(let i=s.shots.length-1;i>=0&&s.shots[i].p===5;i--)run++;
    if(run===3||run===5||run===10)setTimeout(()=>toast(t("{n} kartus iš eilės po 5 taškus!",{n:run})),0);
  }
  S.editing=false;S.adding=false;persistSession(s);render();
}
function setDetail(f,v){
  const s=active();if(!s||S.pending==null)return;const sh=s.shots[S.pending];if(!sh)return;
  if(sh[f]===v)delete sh[f];else sh[f]=v;
  persistSession(s);
  if(f==="m"&&sh.m){advance();return;}
  if(sh.o!=="miss"&&sh.c&&(sh.h||sh.a===5)){advance();return;}
  render();
}
function advance(){
  const s=active();S.pending=null;S.editing=false;
  const prevA=S.cur.a;const fix=S.fix;S.fix=false;
  if(s&&s.mode==="full"){const n=nextEmpty(s,curSeries(s),S.cur);if(n)S.cur=n;}
  if(s&&!fix&&s.mode==="full")checkSeriesRecord(s,curSeries(s));
  if(s&&!fix){
    const r=S.group.rot;const done=s.mode==="full"&&seriesShots(s,curSeries(s)).length>=20;
    if(r==="shot"||(r==="task"&&s.mode==="full"&&(S.cur.a!==prevA||done))||(r==="manual"&&done))rotate();
  }
  render();
}
function undo(){
  const g=groupSessions();let best=null;
  g.forEach(x=>x.shots.forEach((sh,i)=>{if(!best||(sh.t||0)>=(best.sh.t||0))best={x,i,sh};}));
  if(!best)return;
  best.x.shots.splice(best.i,1);S.pending=null;S.editing=false;S.fix=false;
  if(best.x.id!==S.activeId)switchTo(best.x.id,true);
  if(best.x.mode==="full")S.cur={a:best.sh.a,d:best.sh.d};
  persistSession(best.x);render();
}
function endSession(){
  const g=groupSessions();const cur=active();if(cur&&!g.includes(cur))g.push(cur);
  let focus=null;
  g.forEach(s=>{if(!s.shots.length){deleteSession(s.id);}else{s.done=true;persistSession(s);if(!focus||s.id===S.activeId)focus=s;}});
  S.group.ids=[];saveGroup();S.curs={};S.adding=false;
  [...new Set(g.filter(x=>x.shots.length).map(x=>x.playerId))].forEach(checkWeek);
  setActive(null);S.view=focus?"stats":"rec";lsSet("tdp-view",S.view);
  if(focus){S.f.player=g.filter(s=>s.shots.length).length>1?"":focus.playerId;lsSet("tdp-f",S.f);}
  const doneIds=g.filter(x=>x.shots.length).map(x=>x.id);
  if(doneIds.length&&!lsGet("tdp-reflect-off",false)){S.reflectBack="stats";openReflect(doneIds);}
  render();window.scrollTo(0,0);
}

const RF_TAGS=["Vėjas","Nuovargis","Nauji rutuliai","Kieta aikštelė","Minkšta aikštelė","Žiūrovai","Karštis","Šaltis"];
const emptyPlan=()=>({cues:[],ritual:[],ifs:[]});
function planOf(p){const pl=p&&p.plan;return{cues:(pl&&pl.cues)||[],ritual:(pl&&pl.ritual)||[],ifs:(pl&&pl.ifs)||[]};}
function planHas(p){const x=planOf(p);return x.cues.length+x.ritual.length+x.ifs.length>0;}
function notePlayer(){
  const pl=activePlayers();if(!pl.length)return null;
  let p=pl.find(x=>x.id===S.noteP);if(!p){p=pl.find(x=>x.id===S.f.player)||pl[0];S.noteP=p.id;}
  return p;
}
function playerShots(pid,days){
  const cut=days?periodCut(String(days)):null;
  return flatShots(S.sessions.filter(s=>s.playerId===pid&&(!cut||s.date>=cut)),{a:0,d:0});
}
const TIP={
  short:["Krenta per trumpai","Aukštesnis mojis, žiūriu už taikinio"],
  long:["Praskrenda per toli","Žemesnė, tiesesnė trajektorija"],
  left:["Klaidos į kairę","Ranka arti kūno, pečiai į taikinį"],
  right:["Klaidos į dešinę","Ranka arti kūno, pečiai į taikinį"],
  ob:["Pirma kliūtis 2 ar 4 rungtyje","Aukštesnė trajektorija, kritimas už kliūties"],
  side:["Pataikau į rutulio šoną","Žiūriu į rutulio centrą iki pat paleidimo"]
};
function dominantIssue(shots){
  const M=missAgg(shots);if(M.miss.length<4)return null;
  const out=[];const dm=M.short+M.long,lr=M.left+M.right;
  if(dm>=3)out.push({k:M.short>=M.long?"short":"long",w:Math.max(M.short,M.long)});
  if(lr>=3&&Math.abs(M.left-M.right)/lr>=0.2)out.push({k:M.left>M.right?"left":"right",w:Math.max(M.left,M.right)});
  if((M.c.OB||0)>=2)out.push({k:"ob",w:M.c.OB});
  const hits=shots.filter(x=>x.p>0&&x.h);if(hits.length>=6&&hits.filter(x=>x.h!=="C").length/hits.length>=0.4)out.push({k:"side",w:hits.filter(x=>x.h!=="C").length});
  return out.sort((a,b)=>b.w-a.w);
}
function planSuggestions(p){
  const iss=dominantIssue(playerShots(p.id,90))||[];const have=planOf(p).ifs.map(x=>x.w);
  return iss.map(i=>({w:t(TIP[i.k][0]),t:t(TIP[i.k][1])})).filter(s=>!have.includes(s.w));
}
function weakSpot(pid){
  const all=playerShots(pid,90);const cells=[];
  AT.forEach(a=>DIST.forEach(d=>{const sh=all.filter(x=>x.a===a.n&&x.d===d);if(sh.length>=3)cells.push({a:a.n,d,v:avg(sh.map(x=>x.p)),sh});}));
  if(cells.length<3)return null;cells.sort((x,y)=>x.v-y.v);const c=cells[0];
  const iss=dominantIssue(c.sh);return{a:c.a,d:c.d,tip:iss&&iss.length?t(TIP[iss[0].k][1]):""};
}
function bestSeries(pid){
  let best=null;
  S.sessions.filter(s=>s.playerId===pid&&s.mode==="full").forEach(s=>seriesTotals(s).filter(tt=>tt.n===20).forEach(tt=>{if(!best||tt.sum>best.sum)best={sum:tt.sum,s};}));
  return best;
}

/* ----- Stats ----- */
function periodCut(p,offset){
  if(p==="all")return null;const n=+p;const d=new Date();d.setDate(d.getDate()-n*(offset||1)+1);return ymd(d);
}
function filteredSessions(f,opts){
  opts=opts||{};let ss=dataSessions();
  if(f.player)ss=ss.filter(s=>s.playerId===f.player);
  if(f.kind!=="all")ss=ss.filter(s=>s.kind===f.kind);
  if(opts.range){ss=ss.filter(s=>(!opts.range[0]||s.date>=opts.range[0])&&(!opts.range[1]||s.date<opts.range[1]));}
  else{const c=periodCut(f.period);if(c)ss=ss.filter(s=>s.date>=c);}
  return ss.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0));
}
function flatShots(ss,f){
  const out=[];ss.forEach(s=>s.shots.forEach(x=>{if((!f.a||x.a===f.a)&&(!f.d||x.d===f.d))out.push(Object.assign({sid:s.id,date:s.date,pid:s.playerId},x));}));return out;

}

  if(tr&&pts.length>=4){const tn=Math.max(2,Math.floor(pts.length/3));const a=avg(pts.slice(0,tn).map(p=>p.v)),b=avg(pts.slice(-tn).map(p=>p.v));const d=b-a;const c=Math.abs(d)<2?"flat":d>0?"up":"down";
    tr.innerHTML=`${t("Pirmų {k} treniruočių vidurkis <b>{a}</b>, paskutinių {k} – <b>{b}</b>:",{k:tn,a:fmt1(a),b:fmt1(b)})} <span class="delta ${c}">${c==="up"?t("▲ tobulėjate"):c==="down"?t("▼ rezultatai krito"):t("■ be esminio pokyčio")} (${d>0?"+":""}${fmt1(d)})</span>`;}
  else if(tr)tr.textContent=pts.length<4?t("Tendencijai reikia bent 4 treniruočių pasirinktame laikotarpyje."):"";
}

function viewHist(){
  let ss=dataSessions().slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0));
  const pls=dataPlayers();const fp=S.f.player;
  if(fp)ss=ss.filter(s=>s.playerId===fp);
  let h="";
  if(isDemo())h+=`<div class="banner"><span>${t("Rodomi <b>pavyzdiniai duomenys</b>.")}</span></div>`;
  if(pls.length>1)h+=`<div class="chips">${chip("f-player","",t("Visi"),!fp)}${pls.filter(p=>!p.archived).map(p=>chip("f-player",p.id,p.name,fp===p.id)).join("")}</div>`;
  if(!ss.length)return h+`<div class="card"><p class="empty">${t("Treniruočių dar nėra.")}</p></div>`;
  h+=ss.slice(0,150).map(s=>{
    const open=S.openHist===s.id;const tots=seriesTotals(s);const full=tots.filter(t=>t.n===20);
    const sc=s.mode==="full"&&full.length?(full.length===1?full[0].sum:fmt1(avg(full.map(t=>t.sum)))):fmt1(sessScore(s));
    let body="";
    if(open){
      if(s.note)body+=`<div class="small ink2">„${esc(s.note)}“</div>`;
      if(s.mode==="full")body+=`<table class="tbl"><thead><tr><th>${t("Serija")}</th>${AT.map(a=>`<th>${a.n}</th>`).join("")}<th>Σ</th></tr></thead><tbody>${tots.map(t=>{const sh=seriesShots(s,t.k);return `<tr><td>${t.k+1}${t.n<20?` <span class="muted small">(${t.n}/20)</span>`:""}</td>${AT.map(a=>`<td>${sh.filter(x=>x.a===a.n).reduce((q,y)=>q+y.p,0)}</td>`).join("")}<td><b>${t.sum}</b></td></tr>`;}).join("")}</tbody></table>`;
      else{const combos={};s.shots.forEach(x=>{const k=x.a+"|"+x.d;(combos[k]=combos[k]||[]).push(x.p);});body+=`<table class="tbl"><thead><tr><th>${t("Pratimas")}</th><th>${t("Metimai")}</th><th>${t("Vid.")}</th><th>${t("Pataik.")}</th></tr></thead><tbody>${Object.entries(combos).map(([k,v])=>{const[a,d]=k.split("|");return `<tr><td>${t("{a} rungtis, {d} m",{a,d})}</td><td>${v.length}</td><td>${fmt1(avg(v))}</td><td>${pct(v.filter(x=>x>0).length,v.length)} %</td></tr>`;}).join("")}</tbody></table>`;}
      if(!isDemo()){
        if(S.confirmDel===s.id)body+=`<div class="confirm"><span>${t("Ištrinti šią treniruotę ({n} metimai)? To atšaukti negalima.",{n:s.shots.length})}</span><div class="row"><button class="btn warn sm" data-act="h-del-yes" data-v="${s.id}">${t("Taip, ištrinti")}</button><button class="btn ghost sm" data-act="h-del-no">${t("Ne")}</button></div></div>`;
        else body+=`<div class="row"><button class="btn sm" data-act="h-resume" data-v="${s.id}">${s.done?t("Redaguoti / tęsti"):t("Tęsti")}</button><button class="btn sm ghost" data-act="h-del" data-v="${s.id}">${t("Ištrinti")}</button></div>`;
      }
    }
    return `<div class="card hist-item"><button class="hist-head" data-act="h-open" data-v="${s.id}" aria-expanded="${open}"><div class="stack" style="gap:3px"><span><b>${dateLt(s.date)}</b> · ${esc(playerName(s.playerId))}</span><span class="row" style="gap:6px"><span class="tag ${s.kind==="comp"?"comp":""}">${KIND[s.kind]||""}</span><span class="small muted">${s.mode==="full"?t("{n} serija(-os)",{n:tots.length}):t("Pratimas")} · ${t("{n} met.",{n:s.shots.length})}${s.done?"":" · "+t("nebaigta")}</span></span></div><span class="sc">${sc}<small>${s.mode==="full"&&full.length?" /100":" /100*"}</small></span></button>${body}</div>`;
  }).join("");
  h+=`<p class="small muted">${t("* Pratimų ir nepilnų serijų rezultatas perskaičiuotas į 100 balų skalę (vid. taškai × 20).")}</p>`;
  return h;
}

async function addPlayer(src){
  const inp=$("#"+src);const name=(inp&&inp.value||"").trim();if(!name){inp&&inp.focus();return;}
  const p={id:uid("p"),name,createdAt:Date.now(),archived:false};
  S.players.push(p);inp.value="";
  if(src==="sw-newpl"){addToGroup(p.id);}else{S.nf.pids=(S.nf.pids||[]).concat(p.id);keepForm();render();}

}
async function saveFile(filename,data,mime){
  if(DL)return DL.save({filename,data});
  const blob=new Blob([data],{type:mime});
  try{const file=new File([blob],filename,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return;}}catch(e){if(e&&e.name==="AbortError")throw{code:"declined"};}
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function doExport(kind){
  try{
    if(kind==="json"){await saveFile(`tir-de-precision-${today()}.json`,JSON.stringify({version:1,exported:new Date().toISOString(),players:S.players,sessions:S.sessions},null,1),"application/json");}
    else{
      const rows=[[t("data"),t("zaidejas"),t("tipas"),t("rezimas"),t("serija"),t("rungtis"),t("atstumas_m"),t("rezultatas"),t("taskai"),t("klaidos_kryptis"),t("kontaktas"),t("vieta")]];
      S.sessions.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(s=>s.shots.forEach(x=>rows.push([s.date,playerName(s.playerId),KIND[s.kind]||"",s.mode==="full"?t("serija"):t("pratimas"),s.mode==="full"?x.s+1:"",x.a,x.d,OUT_LABEL[x.o]||x.o,x.p,x.m?DIR_LABEL[x.m]||x.m:"",x.c?CONTACT[x.c]:"",x.h?SIDE[x.h]:""])));
      const csv="﻿"+rows.map(r=>r.map(v=>{v=String(v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(";")).join("\n");
      await saveFile(`tir-de-precision-${t("metimai")}-${today()}.csv`,csv,"text/csv");
    }
    S.msg=t("Failas paruoštas.");
    if(kind==="json"){lsSet("tdp-lastbackup",Date.now());lsSet("tdp-backup-snooze",0);toast(t("Atsarginė kopija paruošta"));}
  }catch(e){S.msg=e&&e.code==="declined"?t("Atsisiuntimas atšauktas."):t("Nepavyko paruošti failo.");if(S.view!=="players")toast(S.msg);}
  render();
}
async function doImport(file){
  try{
    const txt=await file.text();const d=JSON.parse(txt);
    const P=Array.isArray(d.players)?d.players:[],SS=Array.isArray(d.sessions)?d.sessions:[];
    let np=0,ns=0;
    const norm=t=>String(t||"").trim().toLocaleLowerCase(LANG);const map={};let nm=0;
    for(const p of P){if(!p.id)continue;
      const same=S.players.find(x=>x.id===p.id)||S.players.find(x=>norm(x.name)===norm(p.name));
      if(same){map[p.id]=same.id;if(same.id!==p.id)nm++;continue;}
      const q={id:p.id,name:String(p.name||t("Be vardo")),createdAt:p.createdAt||Date.now(),archived:!!p.archived};S.players.push(q);map[p.id]=q.id;await savePlayer(q);np++;}
    for(const s of SS){if(!s.id||!Array.isArray(s.shots)||S.sessions.some(x=>x.id===s.id))continue;const q=clone(s);q.playerId=map[q.playerId]||q.playerId;q.updatedAt=Date.now();S.sessions.push(q);
      if(S.store==="db"){try{const b=clone(q);delete b.id;await DB.collection("sessions").doc(q.id).set(b);}catch(e){}}ns++;}
    if(S.store!=="db")saveLocalAll();
    S.msg=t("Įkelta: {s} treniruotės, {p} nauji žaidėjai",{s:ns,p:np})+(nm?t(", {n} sujungti pagal vardą",{n:nm}):"")+".";
  }catch(e){S.msg=t("Nepavyko perskaityti failo. Ar tai šios programėlės JSON kopija?");}
  render();
}

      S.curs={};S.pending=null;S.editing=false;
      const first=list.find(x=>x.mode==="full"&&seriesShots(x,curSeries(x)).length<20)||list[0];

    case"pl-archive":{const p=S.players.find(x=>x.id===v);if(p){p.archived=!p.archived;savePlayer(p);render();}break;}

    case"lang":if(v!==LANG){lsSet("tdp-lang",v);location.reload();}break;
  }
});
function keepForm(){const n=$("#nf-note"),d=$("#nf-date");if(n)S.nf.note=n.value;if(d&&d.value)S.nf.date=d.value;}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id&&["pl-new","pl-new-rec","nf-newpl","sw-newpl"].includes(e.target.id)){e.preventDefault();addPlayer(e.target.id);}});
$("#impfile").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)doImport(f);e.target.value="";});
let rsT;window.addEventListener("resize",()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(S.view==="stats")drawCharts();},150);});
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(S.view==="stats")render();});}catch(e){}
new MutationObserver(()=>{if(S.view==="stats")render();}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

render();initStore();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
})();
